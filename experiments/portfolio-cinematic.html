<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayush Mishra — SDET Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,600&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'DM Mono',monospace}

/* ─── MASTER CANVAS ─── */
#c{position:fixed;inset:0;z-index:0}

/* ─── GRAIN — 35mm film, not digital ─── */
#grain{
  position:fixed;inset:0;z-index:9998;pointer-events:none;
  opacity:.055;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='512' height='512' filter='url(%23noise)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
  animation:grainShift 0.08s steps(1) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}
  10%{transform:translate(-1px,1px)}
  20%{transform:translate(1px,-1px)}
  30%{transform:translate(-2px,2px)}
  40%{transform:translate(2px,-2px)}
  50%{transform:translate(-1px,-1px)}
  60%{transform:translate(1px,1px)}
  70%{transform:translate(-2px,-1px)}
  80%{transform:translate(2px,2px)}
  90%{transform:translate(-1px,2px)}
  100%{transform:translate(1px,-2px)}
}

/* ─── VIGNETTE ─── */
#vignette{
  position:fixed;inset:0;z-index:9997;pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.72) 100%);
}

/* ─── STAGE ─── */
#stage{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  perspective:1200px;
}

/* ═══════════════════════════════════════════════════════
   THE SEQUENCE — JS-driven, not CSS animation hell
   Every moment has ONE job. Silence between beats.
   Nolan rule: what you DON'T show is as powerful.
═══════════════════════════════════════════════════════ */

/* ─── FLASH FRAMES — white snap, like a cut ─── */
#flash{
  position:fixed;inset:0;z-index:500;
  background:#fff;
  opacity:0;pointer-events:none;
}

/* ─── HORIZONTAL DIVIDER ─── */
#divider{
  width:0;height:1px;
  position:relative;z-index:10;
  margin:0;
  background:linear-gradient(90deg,transparent,#C9A84C 20%,#E2C47A 50%,#C9A84C 80%,transparent);
  box-shadow:0 0 20px 1px rgba(201,164,72,.6);
  opacity:0;
  transition:none;
}

/* ─── NAME BLOCK ─── */
#names{
  position:relative;z-index:10;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}

/* ─── AAYUSH ─── */
#n-aayush{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(80px,18vw,190px);
  letter-spacing:.12em;
  color:#fff;
  line-height:.92;
  opacity:0;
  display:block;
  transform-origin:center bottom;
  will-change:transform,opacity,filter;
  text-shadow:
    0 0 0 transparent,
    0 0 0 transparent;
}

/* ─── MISHRA ─── */
#n-mishra{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(80px,18vw,190px);
  letter-spacing:.12em;
  line-height:.92;
  opacity:0;
  display:block;
  color:transparent;
  -webkit-text-stroke:2px #C9A84C;
  will-change:transform,opacity,filter;
  transform-origin:center top;
}

/* ─── SDET LINE ─── */
#n-sdet{
  margin-top:32px;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(14px,2.8vw,32px);
  letter-spacing:.65em;
  color:#C9A84C;
  opacity:0;
  display:block;
  will-change:opacity,letter-spacing;
}

/* ─── ROLE SUBTITLE ─── */
#n-role{
  margin-top:10px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(12px,1.6vw,18px);
  letter-spacing:.18em;
  color:rgba(245,237,216,.38);
  opacity:0;
  will-change:opacity;
}

/* ─── ENTER BUTTON ─── */
#enter{
  margin-top:60px;
  opacity:0;
  position:relative;z-index:10;
  will-change:opacity,transform;
}
#enter button{
  background:transparent;
  border:none;
  border-top:1px solid rgba(201,164,72,.6);
  border-bottom:1px solid rgba(201,164,72,.6);
  color:rgba(201,164,72,.9);
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(13px,1.8vw,18px);
  letter-spacing:.55em;
  padding:14px 44px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:color .35s,border-color .35s,box-shadow .35s;
}
#enter button::before{
  content:'';position:absolute;
  top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(201,164,72,.12),transparent);
  transition:left .55s cubic-bezier(.16,1,.3,1);
}
#enter button:hover{
  color:#fff;
  border-color:#C9A84C;
  box-shadow:0 0 40px rgba(201,164,72,.15);
}
#enter button:hover::before{left:100%}

/* ─── CORNER MARKS ─── */
.mark{
  position:fixed;z-index:10;
  width:22px;height:22px;
  opacity:0;
  will-change:opacity;
}
.mark.tl{top:36px;left:44px;border-top:1px solid rgba(201,164,72,.4);border-left:1px solid rgba(201,164,72,.4)}
.mark.tr{top:36px;right:44px;border-top:1px solid rgba(201,164,72,.4);border-right:1px solid rgba(201,164,72,.4)}
.mark.bl{bottom:36px;left:44px;border-bottom:1px solid rgba(201,164,72,.4);border-left:1px solid rgba(201,164,72,.4)}
.mark.br{bottom:36px;right:44px;border-bottom:1px solid rgba(201,164,72,.4);border-right:1px solid rgba(201,164,72,.4)}

/* ─── TIMECODE ─── */
#tc{
  position:fixed;bottom:38px;right:52px;
  font-size:9px;letter-spacing:.2em;
  color:rgba(201,164,72,.25);
  z-index:10;opacity:0;
  will-change:opacity;
}

/* ─── PORTFOLIO (after intro) ─── */
#portfolio{
  position:fixed;inset:0;z-index:200;
  background:#0c0a08;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px;
  opacity:0;pointer-events:none;
}
#portfolio.live{opacity:1;pointer-events:all;transition:opacity .9s ease}
#portfolio h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(32px,6vw,72px);
  letter-spacing:.16em;color:#F5EDD8;margin-bottom:6px;
}
#portfolio h1 em{font-style:normal;-webkit-text-stroke:1.5px #C9A84C;color:transparent}
#portfolio p{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(14px,1.8vw,20px);letter-spacing:.14em;
  color:rgba(245,237,216,.38);margin-bottom:44px;
}
.p-nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.p-nav a{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:.22em;text-transform:uppercase;
  color:#C9A84C;text-decoration:none;
  border:1px solid rgba(201,164,72,.3);
  padding:10px 20px;transition:all .25s;
}
.p-nav a:hover{background:rgba(201,164,72,.08);border-color:#C9A84C;color:#fff}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div id="flash"></div>

<div class="mark tl"></div>
<div class="mark tr"></div>
<div class="mark bl"></div>
<div class="mark br"></div>
<div id="tc">00:00:00:00</div>

<div id="stage">
  <div id="names">
    <span id="n-aayush">AAYUSH</span>
    <div id="divider"></div>
    <span id="n-mishra">MISHRA</span>
    <span id="n-sdet">S &nbsp; D &nbsp; E &nbsp; T</span>
    <span id="n-role">Software Development Engineer in Test</span>
  </div>
  <div id="enter">
    <button onclick="leave()"><span>ENTER PORTFOLIO</span></button>
  </div>
</div>

<div id="portfolio">
  <h1>AAYUSH &nbsp;<em>MISHRA</em></h1>
  <p>Senior SDET · AI-Driven Test Automation Engineer</p>
  <div class="p-nav">
    <a href="#">Nova Act AI</a>
    <a href="#">Browser-Use AI</a>
    <a href="#">Playwright E2E</a>
    <a href="#">GitHub Actions</a>
    <a href="#">Selenium WebDriver</a>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   CANVAS ENGINE
   Three layers — deep background nebula, mid particles,
   foreground light streaks. All warm. All breathing.
══════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ── Drifting particles ── */
const particles = Array.from({length:120}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx:(Math.random()-.5)*.22,
  vy:(Math.random()-.5)*.22,
  r: Math.random()*1.4+.2,
  a: Math.random()*.5+.1,
  ph:Math.random()*Math.PI*2,
  gold: Math.random()>.45,
}));

/* ── Light streaks ── */
const streaks = Array.from({length:8}, () => makeStreak());
function makeStreak(){
  const angle = (Math.random()-.5)*.3; /* nearly horizontal */
  return {
    x: -200,
    y: Math.random()*window.innerHeight,
    vx: 1.8 + Math.random()*2.2,
    vy: Math.tan(angle)*2,
    len: 120 + Math.random()*180,
    a: .04 + Math.random()*.08,
    w: .4 + Math.random()*.5,
    delay: Math.random()*300,
    born: 0,
  };
}

/* ── Nebula blobs (large, blurred, slow) ── */
const nebulae = [
  {x:.25,y:.35,r:.28,h:42,s:60,l:18,a:.08},
  {x:.72,y:.65,r:.22,h:32,s:45,l:12,a:.06},
  {x:.5, y:.5, r:.18,h:42,s:70,l:22,a:.04},
];

let frameN = 0;

function draw(){
  requestAnimationFrame(draw);
  frameN++;

  ctx.clearRect(0,0,W,H);

  /* Deep background — near black with warm tint */
  ctx.fillStyle='#04030200';
  ctx.fillRect(0,0,W,H);

  /* Nebula */
  nebulae.forEach(n=>{
    const pulse = .85 + .15*Math.sin(frameN*.004 + n.h);
    const g = ctx.createRadialGradient(
      n.x*W, n.y*H, 0,
      n.x*W, n.y*H, n.r*Math.min(W,H)*pulse
    );
    g.addColorStop(0,`hsla(${n.h},${n.s}%,${n.l}%,${n.a})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  });

  /* Particles */
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-5)p.x=W+5;
    if(p.x>W+5)p.x=-5;
    if(p.y<-5)p.y=H+5;
    if(p.y>H+5)p.y=-5;
    const pulse=p.a*(.65+.35*Math.sin(frameN*.022+p.ph));
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.gold
      ?`rgba(201,164,72,${pulse})`
      :`rgba(245,237,216,${pulse*.55})`;
    ctx.fill();
  });

  /* Connections */
  for(let i=0;i<particles.length;i+=2){
    for(let j=i+2;j<particles.length;j+=2){
      const dx=particles[i].x-particles[j].x;
      const dy=particles[i].y-particles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<100){
        ctx.beginPath();
        ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=`rgba(201,164,72,${(1-d/100)*.04})`;
        ctx.lineWidth=.5;
        ctx.stroke();
      }
    }
  }

  /* Light streaks */
  streaks.forEach(s=>{
    if(frameN<s.delay){return;}
    s.x+=s.vx; s.y+=s.vy;
    if(s.x>W+300){
      Object.assign(s, makeStreak());
      s.x=-200; s.delay=0; s.born=frameN;
    }
    const g=ctx.createLinearGradient(s.x-s.len,s.y,s.x,s.y);
    g.addColorStop(0,'transparent');
    g.addColorStop(.6,`rgba(245,237,216,${s.a*.6})`);
    g.addColorStop(1,`rgba(255,255,255,${s.a})`);
    ctx.beginPath();
    ctx.moveTo(s.x-s.len,s.y);
    ctx.lineTo(s.x,s.y);
    ctx.strokeStyle=g;
    ctx.lineWidth=s.w;
    ctx.stroke();
  });
}
draw();

/* ══════════════════════════════════════════════════════════
   TIMECODE
══════════════════════════════════════════════════════════ */
const tcEl = document.getElementById('tc');
let startMs = null;
function updateTC(ms){
  if(!startMs) startMs=ms;
  const elapsed = ms-startMs;
  const h=Math.floor(elapsed/3600000),
        m=Math.floor((elapsed%3600000)/60000),
        s=Math.floor((elapsed%60000)/1000),
        f=Math.floor((elapsed%1000)/41.67);
  tcEl.textContent=
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
  requestAnimationFrame(updateTC);
}
requestAnimationFrame(updateTC);

/* ══════════════════════════════════════════════════════════
   ANIMATION ENGINE — pure imperative JS
   Every beat precisely timed. No CSS animation overlap.

   PHILOSOPHY:
   · Silence is a weapon. Black screen for 1.4s first.
   · White flash cuts like a film splice.
   · AAYUSH doesn't fade — it SLAMS.
   · MISHRA doesn't appear — it ERUPTS.
   · SDET is earned silence after the storm.
   · The divider is a heartbeat, not decoration.

   TIMELINE:
   0.00  — darkness
   1.40  — white flash cut (2 frames)
   1.45  — AAYUSH slams down from void
   1.90  — second flash cut
   2.10  — MISHRA erupts from below
   2.55  — divider line draws itself
   3.20  — aftershock pulse glow on both names
   3.80  — SDET materialises, letter by letter
   4.60  — role subtitle breathes in
   5.00  — corner marks appear
   5.40  — timecode fades in
   6.00  — enter button ascends
══════════════════════════════════════════════════════════ */

const flash   = document.getElementById('flash');
const aayush  = document.getElementById('n-aayush');
const mishra  = document.getElementById('n-mishra');
const divider = document.getElementById('divider');
const sdet    = document.getElementById('n-sdet');
const role    = document.getElementById('n-role');
const enter   = document.getElementById('enter');
const marks   = document.querySelectorAll('.mark');

/* Easing functions */
const easeOut  = t => 1-Math.pow(1-t,4);
const easeOutE = t => t===1?1:1-Math.pow(2,-10*t);
const easeIn   = t => t*t*t;

/* Core animate helper — requestAnimationFrame loop for one property */
function animate(duration, delay, onProgress, onDone){
  setTimeout(()=>{
    const start = performance.now();
    function step(now){
      const raw = Math.min((now-start)/duration,1);
      onProgress(raw);
      if(raw<1) requestAnimationFrame(step);
      else onDone && onDone();
    }
    requestAnimationFrame(step);
  }, delay);
}

/* ── BEAT 1 — White flash cut at t=1400ms ── */
animate(80, 1400, t=>{
  flash.style.opacity = t < .5 ? t*2 : (1-t)*2;
}, null);

/* ── BEAT 2 — AAYUSH slams in at t=1450ms ──
   Starts above viewport, blurred.
   Hits final position with overshoot.
   Like a title card dropped from a height. */
animate(700, 1450, t=>{
  const e = easeOut(t);
  /* Overshoot spring: goes past 0, bounces back */
  const spring = e < .8
    ? e/.8
    : 1 + Math.sin((e-.8)/.2 * Math.PI)*.04*(1-e/.8);
  const y = (1-spring)*-110;
  const blur = (1-e)*16;
  const scale = .88 + .12*e;
  aayush.style.opacity  = Math.min(t*4,1);
  aayush.style.transform= `translateY(${y}px) scaleY(${.9+.1*e})`;
  aayush.style.filter   = `blur(${blur}px)`;
  /* Text glow builds as it lands */
  const glow = Math.max(0,e-.5)*2;
  aayush.style.textShadow=`0 0 ${80*glow}px rgba(255,255,255,${.25*glow}),0 0 ${160*glow}px rgba(255,255,255,${.08*glow})`;
}, ()=>{
  /* After landing — settle glow */
  aayush.style.transform='translateY(0) scaleY(1)';
});

/* ── BEAT 3 — Second flash cut at t=1900ms ── */
animate(70, 1900, t=>{
  flash.style.opacity = t < .5 ? t*1.6 : (1-t)*1.6;
}, null);

/* ── BEAT 4 — MISHRA erupts at t=2100ms ──
   Rises from below. Gold glow intensifies on arrival. */
animate(700, 2100, t=>{
  const e = easeOut(t);
  const spring = e < .8
    ? e/.8
    : 1 + Math.sin((e-.8)/.2 * Math.PI)*.035*(1-e/.8);
  const y = (1-spring)*120;
  const blur = (1-e)*16;
  mishra.style.opacity  = Math.min(t*4,1);
  mishra.style.transform= `translateY(${y}px) scaleY(${.9+.1*e})`;
  mishra.style.filter   = `blur(${blur}px) drop-shadow(0 0 ${60*Math.max(0,e-.5)*2}px rgba(201,164,72,${.7*Math.max(0,e-.5)*2}))`;
}, ()=>{
  mishra.style.transform='translateY(0) scaleY(1)';
});

/* ── BEAT 5 — Divider line draws left→right at t=2550ms ── */
animate(600, 2550, t=>{
  const e = easeOutE(t);
  const maxW = Math.min(W*.82, 860);
  divider.style.width  = (maxW*e)+'px';
  divider.style.opacity= Math.min(t*5,1);
}, null);

/* ── BEAT 6 — Aftershock: both names pulse gold glow at t=3200ms ── */
animate(1200, 3200, t=>{
  /* Sine wave glow — fades out */
  const glow = Math.sin(t*Math.PI) * (1-t*.5);
  const goldGlow = `drop-shadow(0 0 ${50*glow}px rgba(201,164,72,${.6*glow}))`;
  mishra.style.filter = goldGlow;
  aayush.style.textShadow=`0 0 ${60*glow}px rgba(255,255,255,${.2*glow})`;
}, ()=>{
  /* Settle to resting state */
  mishra.style.filter='drop-shadow(0 0 20px rgba(201,164,72,.18))';
  aayush.style.textShadow='0 0 40px rgba(255,255,255,.04)';
});

/* ── BEAT 7 — SDET materialises letter by letter at t=3800ms ──
   Not a fade. Each character burns in one by one. */
const sdetText = sdet.textContent;
sdet.textContent = '';
sdet.style.opacity = 1;

/* Burn each character in */
const sdetChars = ['S','','D','','E','','T'];
const sdetDelays = [3800, 3980, 4080, 4260, 4360, 4540, 4640];
sdetChars.forEach((ch, i) => {
  setTimeout(()=>{
    const span = document.createElement('span');
    if(ch === ''){
      span.style.cssText='display:inline-block;width:.5em';
      span.innerHTML='&nbsp;';
    } else {
      span.textContent = ch;
      span.style.cssText=`display:inline-block;opacity:0;transition:opacity .001s`;
      /* Char flash: flicker 3 times then settle */
      let flickers = 0;
      const flicker = setInterval(()=>{
        span.style.opacity = flickers%2===0?'1':'0.05';
        flickers++;
        if(flickers>=6){
          clearInterval(flicker);
          span.style.opacity='1';
        }
      }, 55);
    }
    sdet.appendChild(span);
  }, sdetDelays[i] - 3800);
});

/* ── BEAT 8 — Role fades in at t=4600ms ── */
animate(1400, 4600, t=>{
  role.style.opacity = easeOut(t) * .38;
  role.style.letterSpacing = (.08 + .1*easeOut(t)) + 'em';
}, null);

/* ── BEAT 9 — Corner marks at t=5000ms ── */
setTimeout(()=>{
  marks.forEach((m,i)=>{
    setTimeout(()=>{ m.style.opacity='1'; m.style.transition='opacity .4s ease'; },i*80);
  });
  tcEl.style.opacity='1';
  tcEl.style.transition='opacity .6s ease';
}, 5000);

/* ── BEAT 10 — Enter button ascends at t=6000ms ── */
animate(900, 6000, t=>{
  const e = easeOut(t);
  enter.style.opacity  = e;
  enter.style.transform= `translateY(${(1-e)*22}px)`;
}, ()=>{
  /* Pulse button subtly */
  let pulse = 0;
  setInterval(()=>{
    pulse += .04;
    const btn = enter.querySelector('button');
    if(btn) btn.style.boxShadow=`0 0 ${20+8*Math.sin(pulse)}px rgba(201,164,72,${.06+.04*Math.sin(pulse)})`;
  }, 50);
});

/* ── CONTINUOUS — subtle breathing on names ──
   Both names very gently scale up/down. Living. */
let breathT = 0;
setInterval(()=>{
  breathT += .015;
  const b = 1 + .003*Math.sin(breathT);
  aayush.style.transform=`scale(${b})`;
  mishra.style.transform=`scale(${1/b})`; /* counter-breath */
}, 50);

/* ══════════════════════════════════════════════════════════
   EXIT — Nolan iris close
══════════════════════════════════════════════════════════ */
function leave(){
  /* Punch out the lights */
  animate(60,0,t=>{
    flash.style.opacity=t*1.5;
  },()=>{
    animate(600,0,t=>{
      flash.style.opacity=Math.max(0,1-t*1.5);
      document.getElementById('stage').style.opacity=1-t;
    },()=>{
      document.getElementById('stage').style.display='none';
      flash.style.opacity=0;
      document.getElementById('portfolio').classList.add('live');
    });
  });
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter') leave();
});
