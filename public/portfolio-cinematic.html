<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayush Mishra — SDET Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,600&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'DM Mono',monospace}

#c{position:fixed;inset:0;z-index:0}

/* GRAIN */
#grain{
  position:fixed;inset:0;z-index:9998;pointer-events:none;
  opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='512' height='512' filter='url(%23noise)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
  animation:grainShift .08s steps(1) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}
  25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}
  75%{transform:translate(-1px,-1px)}
  100%{transform:translate(1px,1px)}
}

/* VIGNETTE */
#vignette{
  position:fixed;inset:0;z-index:9997;pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.72) 100%);
}

/* GOLDEN LIGHT SWEEP overlay */
#goldsweep{
  position:fixed;inset:0;z-index:450;pointer-events:none;
  opacity:0;
  background:linear-gradient(105deg,
    transparent 30%,
    rgba(201,168,76,.12) 45%,
    rgba(226,196,122,.18) 50%,
    rgba(201,168,76,.12) 55%,
    transparent 70%);
  background-size:300% 100%;
}

/* STAGE */
#stage{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:1;
}

/* DIVIDER */
#divider{
  width:0;height:1px;
  position:relative;z-index:10;
  margin:0;
  background:linear-gradient(90deg,transparent,#C9A84C 20%,#E2C47A 50%,#C9A84C 80%,transparent);
  box-shadow:0 0 20px 1px rgba(201,164,72,.5);
  opacity:0;
}

/* NAME BLOCK */
#names{
  position:relative;z-index:10;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}

#n-aayush{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(80px,18vw,190px);
  letter-spacing:.12em;
  color:#fff;
  line-height:.92;
  opacity:0;
  display:block;
  will-change:transform,opacity,filter;
  text-shadow:0 0 0 transparent;
}

#n-mishra{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(80px,18vw,190px);
  letter-spacing:.12em;
  line-height:.92;
  opacity:0;
  display:block;
  color:transparent;
  -webkit-text-stroke:2px #C9A84C;
  will-change:transform,opacity,filter;
}

#n-sdet{
  margin-top:32px;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(14px,2.8vw,32px);
  letter-spacing:.65em;
  color:#C9A84C;
  opacity:0;
  display:block;
  will-change:opacity,letter-spacing;
}

#n-role{
  margin-top:10px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(12px,1.6vw,18px);
  letter-spacing:.18em;
  color:rgba(245,237,216,.38);
  opacity:0;
  will-change:opacity;
}

/* CORNER MARKS */
.mark{
  position:fixed;z-index:10;
  width:22px;height:22px;
  opacity:0;
  will-change:opacity;
}
.mark.tl{top:36px;left:44px;border-top:1px solid rgba(201,164,72,.4);border-left:1px solid rgba(201,164,72,.4)}
.mark.tr{top:36px;right:44px;border-top:1px solid rgba(201,164,72,.4);border-right:1px solid rgba(201,164,72,.4)}
.mark.bl{bottom:36px;left:44px;border-bottom:1px solid rgba(201,164,72,.4);border-left:1px solid rgba(201,164,72,.4)}
.mark.br{bottom:36px;right:44px;border-bottom:1px solid rgba(201,164,72,.4);border-right:1px solid rgba(201,164,72,.4)}

#tc{
  position:fixed;bottom:38px;right:52px;
  font-size:9px;letter-spacing:.2em;
  color:rgba(201,164,72,.25);
  z-index:10;opacity:0;
  will-change:opacity;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div id="goldsweep"></div>

<div class="mark tl"></div>
<div class="mark tr"></div>
<div class="mark bl"></div>
<div class="mark br"></div>
<div id="tc">00:00:00:00</div>

<div id="stage">
  <div id="names">
    <span id="n-aayush">AAYUSH</span>
    <div id="divider"></div>
    <span id="n-mishra">MISHRA</span>
    <span id="n-sdet">S &nbsp; D &nbsp; E &nbsp; T</span>
    <span id="n-role">Software Development Engineer in Test</span>
  </div>
</div>

<script>
/* CANVAS — warm particles, nebula, subtle connections
   60 particles, slower drift, gold/cream palette */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const particles = Array.from({length:60}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx:(Math.random()-.5)*.12,
  vy:(Math.random()-.5)*.12,
  r: Math.random()*1.2+.3,
  baseAlpha: Math.random()*.35+.08,
  ph:Math.random()*Math.PI*2,
  gold: Math.random()>.4,
}));

const nebulae = [
  {x:.25,y:.38,r:.26,h:42,s:55,l:16,a:.07},
  {x:.72,y:.62,r:.20,h:34,s:42,l:11,a:.05},
  {x:.5, y:.5, r:.16,h:42,s:65,l:20,a:.035},
];

const streaks = Array.from({length:5}, () => makeStreak());
function makeStreak(){
  const angle = (Math.random()-.5)*.2;
  return {
    x: -200,
    y: Math.random()*window.innerHeight,
    vx: 1.0 + Math.random()*1.4,
    vy: Math.tan(angle)*1.2,
    len: 100 + Math.random()*140,
    a: .03 + Math.random()*.05,
    w: .3 + Math.random()*.4,
    delay: Math.random()*200,
    born: 0,
  };
}

/* FLOATING TEXT — tech keywords drifting slowly in background */
const floatWords = [
  'Playwright','Selenium','TestNG','CI/CD','API Testing',
  'Automation','Browser Testing','Quality Assurance','DevOps',
  'Java','Python','REST','GraphQL','Performance',
  'Regression','Integration','E2E','Frameworks','Pipeline',
  'assert()','await','describe()','expect','it()',
  'WebDriver','Cypress','Docker','Jenkins','Agile'
];
const floatingTexts = Array.from({length:35}, (_, i) => {
  var sz = 14 + Math.random() * 28;
  var word = floatWords[i % floatWords.length];
  return {
    text: word,
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - .5) * .35,
    vy: (Math.random() - .5) * .2,
    size: sz,
    alpha: .06 + Math.random() * .09,
    rot: (Math.random() - .5) * .25,
    rotV: (Math.random() - .5) * .0006,
    mono: Math.random() > .5,
    hw: word.length * sz * .38,  // half-width estimate
    hh: sz * .55,               // half-height estimate
  };
});

/* PULSING RINGS — concentric circles that breathe */
const rings = Array.from({length:5}, (_, i) => ({
  cx: (.15 + Math.random() * .7) * window.innerWidth,
  cy: (.15 + Math.random() * .7) * window.innerHeight,
  baseR: 80 + Math.random() * 220,
  speed: .005 + Math.random() * .009,
  phase: Math.random() * Math.PI * 2,
  alpha: .04 + Math.random() * .05,
  width: .6 + Math.random() * 1.0,
}));

/* SCAN LINES — horizontal sweeps */
const scanLines = [
  { y: .15, speed: .18, alpha: .06, len: .55 },
  { y: .45, speed: -.14, alpha: .05, len: .40 },
  { y: .7,  speed: .10, alpha: .045, len: .65 },
  { y: .9,  speed: -.08, alpha: .04, len: .35 },
];

let frameN = 0;
let globalFade = 1;

function draw(){
  requestAnimationFrame(draw);
  frameN++;
  ctx.clearRect(0,0,W,H);

  nebulae.forEach(n=>{
    const pulse = .85 + .15*Math.sin(frameN*.003 + n.h);
    const g = ctx.createRadialGradient(
      n.x*W, n.y*H, 0,
      n.x*W, n.y*H, n.r*Math.min(W,H)*pulse
    );
    g.addColorStop(0,'hsla('+n.h+','+n.s+'%,'+n.l+'%,'+(n.a*globalFade)+')');
    g.addColorStop(1,'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  });

  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-5)p.x=W+5;
    if(p.x>W+5)p.x=-5;
    if(p.y<-5)p.y=H+5;
    if(p.y>H+5)p.y=-5;
    const pulse=p.baseAlpha*(.6+.4*Math.sin(frameN*.018+p.ph))*globalFade;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.gold
      ?'rgba(201,164,72,'+pulse+')'
      :'rgba(245,237,216,'+(pulse*.5)+')';
    ctx.fill();
  });

  for(var i=0;i<particles.length;i++){
    for(var j=i+1;j<particles.length;j++){
      var dx=particles[i].x-particles[j].x;
      var dy=particles[i].y-particles[j].y;
      var d=dx*dx+dy*dy;
      if(d<14400){
        var dist=Math.sqrt(d);
        ctx.beginPath();
        ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle='rgba(201,164,72,'+((1-dist/120)*.06*globalFade)+')';
        ctx.lineWidth=.4;
        ctx.stroke();
      }
    }
  }

  streaks.forEach(s=>{
    if(frameN<s.delay) return;
    s.x+=s.vx; s.y+=s.vy;
    if(s.x>W+300){
      Object.assign(s, makeStreak());
      s.x=-200; s.delay=0;
    }
    var g=ctx.createLinearGradient(s.x-s.len,s.y,s.x,s.y);
    g.addColorStop(0,'transparent');
    g.addColorStop(.5,'rgba(226,196,122,'+(s.a*.5*globalFade)+')');
    g.addColorStop(1,'rgba(245,237,216,'+(s.a*globalFade)+')');
    ctx.beginPath();
    ctx.moveTo(s.x-s.len,s.y);
    ctx.lineTo(s.x,s.y);
    ctx.strokeStyle=g;
    ctx.lineWidth=s.w;
    ctx.stroke();
  });

  /* FLOATING TEXT — collision repulsion */
  for(var fi=0; fi<floatingTexts.length; fi++){
    for(var fj=fi+1; fj<floatingTexts.length; fj++){
      var a=floatingTexts[fi], b=floatingTexts[fj];
      var dx=a.x-b.x, dy=(a.y-a.hh)-(b.y-b.hh);
      var overlapX=a.hw+b.hw - Math.abs(dx);
      var overlapY=a.hh+b.hh - Math.abs(dy);
      if(overlapX>0 && overlapY>0){
        var push=.08;
        var sx=dx>0?push:-push, sy=dy>0?push:-push;
        a.vx+=sx; a.vy+=sy;
        b.vx-=sx; b.vy-=sy;
        // clamp speeds so they don't fly off
        a.vx=Math.max(-.6,Math.min(.6,a.vx));
        a.vy=Math.max(-.4,Math.min(.4,a.vy));
        b.vx=Math.max(-.6,Math.min(.6,b.vx));
        b.vy=Math.max(-.4,Math.min(.4,b.vy));
      }
    }
  }

  /* RENDER FLOATING TEXT */
  floatingTexts.forEach(ft=>{
    ft.x += ft.vx;
    ft.y += ft.vy;
    ft.rot += ft.rotV;
    // gentle drag to slow down after repulsion
    ft.vx *= .998;
    ft.vy *= .998;
    if(ft.x < -150) ft.x = W + 100;
    if(ft.x > W + 150) ft.x = -100;
    if(ft.y < -50) ft.y = H + 30;
    if(ft.y > H + 50) ft.y = -30;
    var a = ft.alpha * (.7 + .3 * Math.sin(frameN * .01 + ft.x * .008)) * globalFade;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(ft.x, ft.y);
    ctx.rotate(ft.rot);
    ctx.font = (ft.mono ? '300 ' : 'italic 300 ') + ft.size + 'px ' + (ft.mono ? "'DM Mono',monospace" : "'Cormorant Garamond',serif");
    ctx.fillStyle = ft.mono
      ? 'rgba(201,168,76,1)'
      : 'rgba(245,237,216,1)';
    ctx.shadowColor = ft.mono ? 'rgba(201,168,76,.3)' : 'rgba(245,237,216,.2)';
    ctx.shadowBlur = 8;
    ctx.fillText(ft.text, 0, 0);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  });

  /* RENDER PULSING RINGS */
  rings.forEach(ring=>{
    var r = ring.baseR + 30 * Math.sin(frameN * ring.speed + ring.phase);
    var a = ring.alpha * (.6 + .4 * Math.sin(frameN * ring.speed * .7 + ring.phase)) * globalFade;
    ctx.beginPath();
    ctx.arc(ring.cx, ring.cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,164,72,' + a + ')';
    ctx.lineWidth = ring.width;
    ctx.shadowColor = 'rgba(201,164,72,' + (a * .6) + ')';
    ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // inner ring echo
    ctx.beginPath();
    ctx.arc(ring.cx, ring.cy, r * .55, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,164,72,' + (a * .5) + ')';
    ctx.lineWidth = ring.width * .6;
    ctx.stroke();
    // outer ring echo
    ctx.beginPath();
    ctx.arc(ring.cx, ring.cy, r * 1.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,164,72,' + (a * .2) + ')';
    ctx.lineWidth = ring.width * .3;
    ctx.stroke();
  });

  /* RENDER SCAN LINES */
  scanLines.forEach(sl=>{
    sl.y += sl.speed / H;
    if(sl.y > 1.1) sl.y = -.1;
    if(sl.y < -.1) sl.y = 1.1;
    var yPx = sl.y * H;
    var a = sl.alpha * globalFade;
    var g = ctx.createLinearGradient(W * (.5 - sl.len / 2), yPx, W * (.5 + sl.len / 2), yPx);
    g.addColorStop(0, 'transparent');
    g.addColorStop(.2, 'rgba(201,164,72,' + a + ')');
    g.addColorStop(.5, 'rgba(226,196,122,' + (a * 1.2) + ')');
    g.addColorStop(.8, 'rgba(201,164,72,' + a + ')');
    g.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.moveTo(W * (.5 - sl.len / 2), yPx);
    ctx.lineTo(W * (.5 + sl.len / 2), yPx);
    ctx.strokeStyle = g;
    ctx.lineWidth = 1;
    ctx.shadowColor = 'rgba(201,164,72,' + (a * .5) + ')';
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  });
}
draw();

/* TIMECODE */
var tcEl = document.getElementById('tc');
var startMs = null;
function updateTC(ms){
  if(!startMs) startMs=ms;
  var elapsed = ms-startMs;
  var hh=Math.floor(elapsed/3600000),
      mm=Math.floor((elapsed%3600000)/60000),
      ss=Math.floor((elapsed%60000)/1000),
      ff=Math.floor((elapsed%1000)/41.67);
  tcEl.textContent=
    String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+':'+String(ff).padStart(2,'0');
  requestAnimationFrame(updateTC);
}
requestAnimationFrame(updateTC);

/* ANIMATION ENGINE
   Timeline:
   0.00  darkness, particles fade in
   0.50  particles visible
   0.80  golden light sweep 1
   1.20  AAYUSH slides down
   2.00  MISHRA rises with golden glow
   2.80  divider draws itself
   3.00  corner marks + timecode
   3.40  SDET materialises
   4.20  role subtitle fades in
   5.60  golden light sweep 2 (exit)
   6.00  smooth fade out -> transition
*/

var goldsweep = document.getElementById('goldsweep');
var aayush  = document.getElementById('n-aayush');
var mishra  = document.getElementById('n-mishra');
var divider = document.getElementById('divider');
var sdet    = document.getElementById('n-sdet');
var role    = document.getElementById('n-role');
var marks   = document.querySelectorAll('.mark');
var stage   = document.getElementById('stage');

var easeOut  = function(t){ return 1-Math.pow(1-t,4); };
var easeOutE = function(t){ return t===1?1:1-Math.pow(2,-10*t); };

function animate(duration, delay, onProgress, onDone){
  var startAt = performance.now() + delay;
  function step(now){
    if(now < startAt){ requestAnimationFrame(step); return; }
    var raw = Math.min((now - startAt) / duration, 1);
    onProgress(raw);
    if(raw < 1) requestAnimationFrame(step);
    else if(onDone) onDone();
  }
  requestAnimationFrame(step);
}

function goldSweep(delay, duration){
  animate(duration, delay, function(t){
    var e = easeOut(t);
    goldsweep.style.opacity = String(Math.sin(t * Math.PI) * .7);
    goldsweep.style.backgroundPosition = (-100 + e * 200) + '% 0';
  }, function(){
    goldsweep.style.opacity = '0';
  });
}

/* BEAT 1 — Golden sweep at t=800ms */
goldSweep(800, 500);

/* BEAT 2 — AAYUSH slides down at t=1200ms */
animate(650, 1200, function(t){
  var e = easeOut(t);
  var y = (1 - e) * -80;
  var blur = (1 - e) * 10;
  aayush.style.opacity  = String(Math.min(t * 3, 1));
  aayush.style.transform = 'translateY(' + y + 'px)';
  aayush.style.filter   = 'blur(' + blur + 'px)';
  var glow = Math.max(0, e - .4) / .6;
  aayush.style.textShadow = '0 0 ' + (60*glow) + 'px rgba(201,168,76,' + (.2*glow) + '), 0 0 ' + (120*glow) + 'px rgba(201,168,76,' + (.06*glow) + ')';
}, function(){
  aayush.style.transform = 'translateY(0)';
  aayush.style.filter = 'blur(0px)';
  aayush.style.textShadow = '0 0 40px rgba(201,168,76,.08)';
});

/* BEAT 3 — MISHRA rises at t=2000ms */
animate(650, 2000, function(t){
  var e = easeOut(t);
  var y = (1 - e) * 80;
  var blur = (1 - e) * 10;
  var glowStr = Math.max(0,e-.3)/.7;
  mishra.style.opacity  = String(Math.min(t * 3, 1));
  mishra.style.transform = 'translateY(' + y + 'px)';
  mishra.style.filter   = 'blur(' + blur + 'px) drop-shadow(0 0 ' + (40*glowStr) + 'px rgba(201,164,72,' + (.5*glowStr) + '))';
}, function(){
  mishra.style.transform = 'translateY(0)';
  mishra.style.filter = 'drop-shadow(0 0 20px rgba(201,164,72,.18))';
});

/* BEAT 4 — Divider draws at t=2800ms */
animate(500, 2800, function(t){
  var e = easeOutE(t);
  var maxW = Math.min(W * .78, 820);
  divider.style.width  = (maxW * e) + 'px';
  divider.style.opacity = String(Math.min(t * 4, 1));
}, null);

/* BEAT 5 — Corner marks + timecode at t=3000ms */
animate(400, 3000, function(t){
  var e = easeOut(t);
  marks.forEach(function(m){ m.style.opacity = String(e); });
  tcEl.style.opacity = String(e);
}, null);

/* BEAT 6 — SDET at t=3400ms */
sdet.textContent = '';
sdet.style.opacity = '1';
var sdetChars = ['S','','D','','E','','T'];
var sdetOffsets = [0, 120, 200, 320, 400, 520, 600];
sdetChars.forEach(function(ch, i){
  setTimeout(function(){
    var span = document.createElement('span');
    if(ch === ''){
      span.style.cssText = 'display:inline-block;width:.5em';
      span.innerHTML = '&nbsp;';
    } else {
      span.textContent = ch;
      span.style.cssText = 'display:inline-block;opacity:0;transition:opacity .15s ease';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ span.style.opacity = '1'; });
      });
    }
    sdet.appendChild(span);
  }, 3400 + sdetOffsets[i]);
});

/* BEAT 7 — Role subtitle at t=4200ms */
animate(600, 4200, function(t){
  var e = easeOut(t);
  role.style.opacity = String(e * .4);
  role.style.letterSpacing = (.1 + .08 * e) + 'em';
}, null);

/* BEAT 8 — Gentle breathing */
var breathT = 0;
var breathActive = true;
var breathInterval = setInterval(function(){
  if(!breathActive) return;
  breathT += .012;
  var b = 1 + .002 * Math.sin(breathT);
  if(parseFloat(aayush.style.opacity) > .9){
    aayush.style.transform = 'scale(' + b + ')';
  }
  if(parseFloat(mishra.style.opacity) > .9){
    mishra.style.transform = 'scale(' + (1/b) + ')';
  }
}, 50);

/* BEAT 9 — Exit golden sweep at t=5600ms */
goldSweep(5600, 600);

/* BEAT 10 — Auto-transition at t=6000ms */
animate(900, 6000, function(t){
  var e = easeOut(t);
  stage.style.opacity = String(1 - e);
  globalFade = 1 - e;
  marks.forEach(function(m){ m.style.opacity = String(1 - e); });
  tcEl.style.opacity = String(1 - e);
}, function(){
  breathActive = false;
  clearInterval(breathInterval);
  if(window.top !== window){
    try{
      window.top.postMessage('portfolio-cinematic:enter', window.location.origin);
      return;
    }catch(err){}
  }
  window.location.href = '/home';
});
</script>
</body>
</html>
