<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Paint the saved theme's background before anything else loads, so a
      // dark theme doesn't flash white on every visit or refresh
      // (ThemeContext saves it whenever the theme changes).
      (function () {
        try {
          var bg = localStorage.getItem("portfolioThemeBg");
          if (bg && /^#[0-9a-f]{3,8}$/i.test(bg)) document.documentElement.style.setProperty("--page-bg", bg);
        } catch (e) {}
        // The Projects pages fill in after the GitHub data arrives, so they
        // restore their own scroll position on a refresh (useReloadScroll.js)
        if (/^\/projects(\/|$)/.test(location.pathname) && "scrollRestoration" in history) {
          history.scrollRestoration = "manual";
        }
      })();
    </script>
    <!-- A variable, not an inline background, so page rules like Tech Universe's html.uv-standalone still win -->
    <style>
      html {
        background-color: var(--page-bg, transparent);
      }
    </style>

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
