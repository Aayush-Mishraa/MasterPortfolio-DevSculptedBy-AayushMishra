<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuralForge · AI Engineering OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--bg-2:#0c0c0f;--panel:#111114;--panel-2:#18181b;--hover:#1c1c21;--border:#232329;--border-2:#34343c;
  --text:#f4f4f5;--muted:#a1a1aa;--dim:#71717a;
  --accent:#8b5cf6;--accent-soft:rgba(139,92,246,.14);--accent-ink:#c4b5fd;--cyan:#22d3ee;--cyan-soft:rgba(34,211,238,.12);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.13);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.13);--err:#ef4444;--err-soft:rgba(239,68,68,.13);
  --code-bg:#0b0b0e;--shadow:0 24px 64px rgba(0,0,0,.55);
  --t-kw:#c4b5fd;--t-str:#86efac;--t-num:#fcd34d;--t-com:#6b7280;--t-fn:#67e8f9;--t-dec:#f9a8d4;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#fafafa;--bg-2:#f4f4f5;--panel:#ffffff;--panel-2:#f4f4f5;--hover:#ececef;--border:#e4e4e7;--border-2:#d4d4d8;
    --text:#18181b;--muted:#52525b;--dim:#71717a;--accent:#7c3aed;--accent-soft:rgba(124,58,237,.10);--accent-ink:#6d28d9;--cyan:#0891b2;--cyan-soft:rgba(8,145,178,.10);
    --ok:#16a34a;--ok-soft:rgba(22,163,74,.10);--warn:#d97706;--warn-soft:rgba(217,119,6,.10);--err:#dc2626;--err-soft:rgba(220,38,38,.10);
    --code-bg:#f7f7f9;--shadow:0 24px 64px rgba(0,0,0,.14);
    --t-kw:#7c3aed;--t-str:#15803d;--t-num:#b45309;--t-com:#9ca3af;--t-fn:#0e7490;--t-dec:#be185d;color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#fafafa;--bg-2:#f4f4f5;--panel:#ffffff;--panel-2:#f4f4f5;--hover:#ececef;--border:#e4e4e7;--border-2:#d4d4d8;
  --text:#18181b;--muted:#52525b;--dim:#71717a;--accent:#7c3aed;--accent-soft:rgba(124,58,237,.10);--accent-ink:#6d28d9;--cyan:#0891b2;--cyan-soft:rgba(8,145,178,.10);
  --ok:#16a34a;--ok-soft:rgba(22,163,74,.10);--warn:#d97706;--warn-soft:rgba(217,119,6,.10);--err:#dc2626;--err-soft:rgba(220,38,38,.10);
  --code-bg:#f7f7f9;--shadow:0 24px 64px rgba(0,0,0,.14);
  --t-kw:#7c3aed;--t-str:#15803d;--t-num:#b45309;--t-com:#9ca3af;--t-fn:#0e7490;--t-dec:#be185d;color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Geist,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.i{flex:none;display:inline-block;vertical-align:-3px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.sidebar{border-right:1px solid var(--border);background:var(--bg-2);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:600;letter-spacing:-.01em;text-decoration:none}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:auto -4px -10px auto;width:18px;height:18px;border-radius:50%;background:var(--cyan);opacity:.85}
.logo svg{position:relative;z-index:1}
.brand small{display:block;font-weight:400;color:var(--dim);font-size:11.5px;margin-top:-2px}
.nav-sec{padding:14px 18px 4px;font-size:11.5px;color:var(--dim);font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;margin:1px 8px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--text)}
.nav a.active .i{color:var(--accent-ink)}
.nav a .count{margin-left:auto;font-size:11px;color:var(--dim)}
.side-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border)}
.side-card{margin:10px 8px 4px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.side-card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--border-2)}
.m-brand{display:none}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border:1px solid var(--border);background:var(--panel);color:var(--dim);border-radius:7px;min-width:260px;cursor:pointer;font-size:13px}
.search-btn:hover{border-color:var(--border-2);color:var(--muted)}
.search-btn .kbd{margin-left:auto}
.kbd{font:11px/1 "JetBrains Mono",monospace;padding:3px 5px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--panel-2);white-space:nowrap}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}
.site-actions{display:flex;align-items:center;gap:7px;flex:none}
.site-action{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--muted);font-size:12px;text-decoration:none;white-space:nowrap}
.site-action:hover{color:var(--text);border-color:var(--border-2);background:var(--hover)}
.site-action.primary{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
#view{flex:1;overflow:auto;min-height:0;position:relative}
.page{max-width:1240px;margin:0 auto;padding:26px 28px 56px}
.bottomnav{display:none}

@media (max-width:1023px){
  #app{grid-template-columns:62px minmax(0,1fr)}
  .sidebar .lbl,.nav-sec,.nav .count,.side-card,.brand-txt{display:none}
  .nav a{justify-content:center;padding:9px}
  .brand{justify-content:center;padding:14px 0 8px}
  .search-btn{min-width:200px}
}
@media (max-width:767px){
  #app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .m-brand{display:flex}
  .crumbs{display:none}
  .search-btn{min-width:0;flex:1;margin-left:8px}
  .search-btn .kbd{display:none}
  .topbar{padding:0 12px}
  .site-action span{display:none}
  .page{padding:18px 14px 96px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg-2);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:10.5px;color:var(--dim);text-decoration:none}
  .bottomnav a.active{color:var(--accent-ink)}
}

/* ---------- primitives ---------- */
.h1{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.025em;margin:0}
.h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0}
.h3{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.row{display:flex;align-items:center}.gap{gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border)}
.card-h .h3{flex:1;min-width:0}
.card-b{padding:14px}
.card-f{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--panel-2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.badge.cy{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--border-2)}
.dot.ok{background:var(--ok)}.dot.acc{background:var(--accent)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}
.progress{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.progress.ok>i{background:var(--ok)}
.seg{display:inline-flex;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:99px;font-size:12px;color:var(--muted);background:var(--panel);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--border-2)}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.field{display:block;margin-bottom:12px}
.field>span{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.input,.select,.textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
.textarea{resize:vertical;line-height:1.5;min-height:80px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.switch{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;width:30px;height:18px;border-radius:99px;background:var(--border-2);position:relative;flex:none;margin:1px 0 0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(12px)}
.switch b{display:block;font-weight:500;font-size:13px}
.switch small{display:block;color:var(--dim);font-size:12px;line-height:1.4}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel)}
.t td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--hover)}
.t tr.click{cursor:pointer}
.t tr.sel td{background:var(--accent-soft)}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent-ink);background:var(--panel-2)}
.empty h3{margin:0 0 4px;font-size:15px;color:var(--text);font-weight:600}
.empty p{margin:0 auto 14px;max-width:46ch;font-size:13px}
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--hover) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:5px;height:12px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}
.note{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:flex-start}
.callout{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--panel);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted)}
.callout.warn{border-left-color:var(--warn)}
.callout b{color:var(--text)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3 .span2{grid-column:1/-1}}
@media (max-width:767px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}

/* ---------- code ---------- */
.code{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:hidden;margin:14px 0;min-width:0}
.code-h{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-bottom:1px solid var(--border);font:12px "JetBrains Mono",monospace;color:var(--dim)}
.code-h .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font:12.5px/1.65 "JetBrains Mono",ui-monospace,monospace;color:var(--text);tab-size:4}
.code-out{border-top:1px dashed var(--border-2);background:var(--panel)}
.code-out .lbl{font-size:11.5px;color:var(--dim);padding:8px 14px 0}
.code-out pre{color:var(--muted)}
.t-kw{color:var(--t-kw)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}.t-fn{color:var(--t-fn)}.t-dec{color:var(--t-dec)}

/* ---------- palette & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:12vh 12px 12px}
.palette{width:min(640px,100%);background:var(--panel);border:1px solid var(--border-2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.palette-in{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
.palette-in input{flex:1;border:0;background:none;outline:none;height:50px;font-size:15px}
.palette-list{overflow-y:auto;padding:6px}
.p-group{font-size:11.5px;color:var(--dim);padding:8px 10px 4px}
.p-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.p-item .grow{color:var(--text)}
.p-item.on{background:var(--accent-soft)}
.p-item .hint{font-size:12px;color:var(--dim)}
.palette-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.2s;z-index:70;background:var(--panel-2);border:1px solid var(--border-2);border-radius:8px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow);pointer-events:none;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:767px){#toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}}

/* ---------- dashboard ---------- */
.hero{padding:6px 0 22px;border-bottom:1px solid var(--border);margin-bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:end}
.hero h1{font-size:40px;line-height:1.05;letter-spacing:-.04em;font-weight:600;margin:10px 0 0;max-width:14ch}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:99px}
.terminal{border:1px solid var(--border);border-radius:10px;background:var(--code-bg);font:12px/1.75 "JetBrains Mono",monospace;padding:12px 14px;color:var(--muted);min-width:0;overflow:hidden}
.terminal .p{color:var(--accent-ink)}
.terminal .k{color:var(--dim);display:inline-block;width:17ch}
.terminal .bar{display:inline-block;height:7px;border-radius:2px;background:var(--cyan);vertical-align:1px;margin-right:6px;opacity:.85}
@media (max-width:1023px){.hero{grid-template-columns:minmax(0,1fr)}.hero h1{font-size:32px}}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:16px}
.metric{padding:12px 16px;border-right:1px solid var(--border);min-width:0}
.metric:last-child{border-right:0}
.metric .l{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.metric .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.metric .s{font-size:11.5px;color:var(--dim)}
@media (max-width:900px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric:nth-child(3){border-right:0}.metric:nth-child(n+4){border-top:1px solid var(--border)}}
@media (max-width:520px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{border-right:1px solid var(--border)!important;border-top:0!important}.metric:nth-child(2n){border-right:0!important}.metric:nth-child(n+3){border-top:1px solid var(--border)!important}.metric:last-child{grid-column:1/-1}}
.heat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.heat-cell{border-radius:7px;padding:9px 10px;border:1px solid var(--border);position:relative;overflow:hidden;min-width:0}
.heat-cell::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:var(--o,0)}
.heat-cell>*{position:relative}
.heat-cell .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat-cell .p{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);text-decoration:none;font-size:13px;min-width:0}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:var(--hover)}
.list-row .t1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl-tag{font:500 11.5px "JetBrains Mono",monospace;color:var(--dim);flex:none}
.bar-row{display:grid;grid-template-columns:128px minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:12.5px;padding:3px 0}
.bar-row .bar{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-row.cy .bar i{background:var(--cyan)}
.bar-row.gr .bar i{background:var(--ok)}

/* ---------- roadmap ---------- */
.rm-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:18px 18px}
.rm-node{cursor:pointer}
.rm-node rect{fill:var(--panel);stroke:var(--border-2);stroke-width:1}
.rm-node:hover rect{stroke:var(--accent)}
.rm-node.completed rect{stroke:var(--ok);fill:var(--panel)}
.rm-node.available rect{stroke:var(--accent);stroke-width:1.5}
.rm-node.locked{opacity:.55}
.rm-node .n{fill:var(--dim);font:500 10.5px "JetBrains Mono",monospace}
.rm-node .tt{fill:var(--text);font:500 12.5px Geist,Inter,sans-serif}
.rm-node .st{font:11px Geist,sans-serif}
.rm-node.completed .st{fill:var(--ok)}.rm-node.available .st{fill:var(--accent-ink)}.rm-node.locked .st{fill:var(--dim)}
.rm-edge{fill:none;stroke:var(--border-2);stroke-width:1.25}
.rm-edge.done{stroke:var(--ok);opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

/* ---------- skill tree ---------- */
.tree-cat{border-bottom:1px solid var(--border)}
.tree-cat:last-child{border-bottom:0}
.tree-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.tree-head:hover{background:var(--hover)}
.tree-head .chev{transition:transform .15s;color:var(--dim)}
.tree-head.open .chev{transform:rotate(90deg)}
.tree-leaves{padding:2px 14px 12px 38px;position:relative}
.tree-leaves::before{content:"";position:absolute;left:21px;top:0;bottom:16px;border-left:1px solid var(--border-2)}
.leaf{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:13px;position:relative}
.leaf::before{content:"";position:absolute;left:-17px;top:50%;width:12px;border-top:1px solid var(--border-2)}
.leaf:hover{background:var(--hover)}
.leaf label{display:flex;gap:9px;align-items:center;flex:1;cursor:pointer;min-width:0}
.leaf.m label span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-2)}

/* ---------- split layouts (lesson + labs) ---------- */
.split{display:grid;min-height:100%}
.split>aside,.split>section{min-width:0}
.pane{border-right:1px solid var(--border);background:var(--bg-2)}
.pane.r{border-right:0;border-left:1px solid var(--border)}
.pane-in{position:sticky;top:0;max-height:calc(100vh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px}
.lesson{grid-template-columns:250px minmax(0,1fr) 290px}
.lab{grid-template-columns:300px minmax(0,1fr) 360px}
.center{padding:24px 32px 64px}
.lesson .center{max-width:820px;margin:0 auto;width:100%}
.ol-mobile{display:none}
@media (max-width:1279px){
  .lesson{grid-template-columns:minmax(0,1fr) 280px}
  .lesson>.pane:first-child{display:none}
  .ol-mobile{display:block;margin-bottom:16px}
  .lab{grid-template-columns:290px minmax(0,1fr)}
  .lab>.pane.r{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}
  .lab>.pane.r .pane-in{position:static;max-height:none}
}
@media (max-width:1023px){
  .lesson,.lab{grid-template-columns:minmax(0,1fr)}
  .lesson>.pane.r,.lab>.pane{border-left:0;border-right:0;border-top:1px solid var(--border)}
  .lab>.pane:first-child{border-top:0;border-bottom:1px solid var(--border)}
  .pane-in{position:static;max-height:none}
  .center{padding:18px 16px 40px}
}
@media (max-width:767px){.split{padding-bottom:70px}}
.ol-h{font-size:11.5px;color:var(--dim);padding:10px 8px 4px;font-weight:500}
.ol-item{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:13px;color:var(--muted)}
.ol-item:hover{background:var(--hover);color:var(--text)}
.ol-item.cur{background:var(--accent-soft);color:var(--text)}
.ol-item .ol-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsec{padding:18px 0;border-bottom:1px solid var(--border)}
.lsec-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.lsec h3{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
.lsec p{color:var(--muted);margin:8px 0;max-width:72ch}
.lsec ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.lsec li{margin:4px 0}
.lsec li b{color:var(--text);font-weight:500}
.check{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border-2);background:var(--panel);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.check.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ring{display:block;margin:0 auto}
.ring .bg{stroke:var(--panel-2)}.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .4s}
.ship{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--panel);margin-top:20px;display:flex;gap:12px}
.ship .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--cyan-soft);color:var(--cyan);flex:none}
.res-link{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;text-decoration:none;background:var(--panel);font-size:13px}
.res-link:hover{border-color:var(--border-2)}
.res-link small{display:block;color:var(--dim);font-size:12px}

/* ---------- labs ---------- */
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.stage{flex:1;min-width:112px;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:9px 10px;position:relative;transition:border-color .2s,background .2s}
.stage .sn{font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:center}
.stage .sd{font-size:11.5px;color:var(--dim);margin-top:3px;min-height:16px;font-family:"JetBrains Mono",monospace}
.stage.run{border-color:var(--accent);background:var(--accent-soft)}
.stage.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--border))}
.stage.done .sn .i{color:var(--ok)}
.arrow{display:grid;place-items:center;width:22px;flex:none;color:var(--border-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--panel);min-width:0}
.tile .l{font-size:11.5px;color:var(--dim)}
.tile .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile.ok .v{color:var(--ok)}.tile.err .v{color:var(--err)}.tile.warn .v{color:var(--warn)}
.chunk{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:12.5px;color:var(--muted);margin-bottom:8px}
.chunk.hit{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.chunk-h{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px}
.score{flex:1;height:5px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.score i{display:block;height:100%;background:var(--cyan)}
.answer{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:14px 16px;font-size:14px;line-height:1.6}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);font:500 11px "JetBrains Mono",monospace;vertical-align:1px;margin-left:2px}
.phases{display:flex;gap:0;overflow-x:auto;padding:2px 0 6px}
.phase{flex:1;min-width:92px;text-align:center;font-size:12px;color:var(--dim);position:relative;padding-top:26px}
.phase::before{content:"";position:absolute;top:8px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--border-2);background:var(--bg);z-index:1}
.phase::after{content:"";position:absolute;top:14px;left:-50%;width:100%;border-top:2px solid var(--border)}
.phase:first-child::after{display:none}
.phase.seen{color:var(--muted)}.phase.seen::before{border-color:var(--ok);background:var(--ok)}
.phase.cur{color:var(--text);font-weight:500}.phase.cur::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);margin-bottom:8px;cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--border-2)}
.step.sel{border-color:var(--accent)}
.step .body{flex:1;min-width:0}
.step .ti{font-size:13px;font-weight:500}
.step .de{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.step .ms{font:11px "JetBrains Mono",monospace;color:var(--dim);white-space:nowrap}
.gate{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--border)}
.gate.pass{background:var(--ok-soft);border-color:transparent}
.gate.block{background:var(--err-soft);border-color:transparent}
.gate .gi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.gate.pass .gi{background:var(--ok);color:#fff}.gate.block .gi{background:var(--err);color:#fff}
.gate b{display:block}.gate small{color:var(--muted)}
.lab-card{display:flex;flex-direction:column;text-decoration:none;padding:16px;gap:8px}
.lab-card:hover{border-color:var(--border-2)}
.lab-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr div{border-radius:6px;padding:8px 10px;text-align:center;font-size:12.5px;border:1px solid var(--border);background:var(--panel)}
.pyr div b{display:block;font-weight:500;color:var(--text)}
.pyr div small{color:var(--dim)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .fs{border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12.5px;background:var(--panel)}
.flow .fs.ai{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.flow .fs.hu{border-color:transparent;background:var(--cyan-soft);color:var(--cyan)}
details.prac{border-bottom:1px solid var(--border)}
details.prac:last-child{border-bottom:0}
details.prac summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center}
details.prac summary::-webkit-details-marker{display:none}
details.prac summary .chev{color:var(--dim);transition:transform .15s}
details.prac[open] summary .chev{transform:rotate(90deg)}
details.prac .pb{padding:0 14px 14px 40px;font-size:13px;color:var(--muted)}
details.prac .pb p{margin:0 0 8px}
details.prac .pb b{color:var(--text);font-weight:500}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--dim)}.kv dd{margin:0;overflow-wrap:anywhere}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.more-grid a{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--panel);text-decoration:none;font-size:13px}

.role-card{padding:14px;display:flex;flex-direction:column;gap:10px}

.footer-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding-bottom:24px!important;align-items:start}

.footer-grid>div:not(:first-child){border-left:1px solid var(--border);padding-left:24px}

.footer-grid b{display:block;color:var(--accent-ink);font:500 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.footer-grid a{display:block;color:var(--muted);font-size:12px;text-decoration:none;margin:7px 0}
.footer-grid a:hover{color:var(--text)}
.arsenal-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
.footer-bottom{display:flex!important;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px!important;font-size:11px}

code:{lang:'python',file:'client.py',src:String.raw`import time, httpx

def fetch_all(url: str, max_retries: int = 3) -> list[dict]:
    items, cursor = [], None
    with httpx.Client(timeout=10) as client:
        while True:
            params = {"cursor": cursor} if cursor else {}
            for attempt in range(max_retries):
                resp = client.get(url, params=params)
                if resp.status_code < 500:
                    break
                time.sleep(2 ** attempt)  # exponential backoff
            resp.raise_for_status()
            page = resp.json()
            items.extend(page["data"])
            cursor = page.get("next_cursor")
            if not cursor:
                return items`},

code:{lang:'python',file:'rrf.py',src:String.raw`def rrf(rankings: list[list[str]], k: int = 60) -> list[tuple[str, float]]:
    scores: dict[str, float] = {}
    for ranking in rankings:
        for rank, doc_id in enumerate(ranking, start=1):
            scores[doc_id] = scores.get(doc_id, 0) + 1 / (k + rank)
    return sorted(scores.items(), key=lambda kv: -kv[1])

def judge(question, expected, actual) -> dict:
    """LLM-as-a-judge with a 1-5 rubric; returns {"score": int, "reason": str}."""
    return json.loads(llm(JUDGE_PROMPT.format(q=question, ref=expected, ans=actual)))

def run_eval(dataset, generate, threshold=4, gate=0.85):
    results = []
    for case in dataset:
        actual = generate(case["input"])
        verdict = judge(case["input"], case["expected"], actual)
        results.append({**case, "actual": actual, **verdict})
    pass_rate = sum(r["score"] >= threshold for r in results) / len(results)
    print(f"pass_rate={pass_rate:.1%} mean={statistics.mean(r['score'] for r in results):.2f}")
    assert pass_rate >= gate, "release gate failed"
    return results`,out:`pass_rate=91.7% mean=4.75`},

            return resp.text
        call = resp.tool_call
        try:
            result = execute(call, allowed=READ_ONLY_TOOLS)
        except ToolError as e:
            errors += 1
            if errors > MAX_TOOL_ERRORS:
                return f"Stopped: repeated tool failures ({e})"
            result = f"error: {e}. Try a different approach."
        messages += tool_messages(resp, call, result)
    return "Stopped: step budget exhausted"`},

def test_paraphrase_invariance(assistant, judge):

/* ============ syntax highlighting ============ */
const KW={
python:'def|return|import|from|class|async|await|for|in|if|elif|else|with|as|try|except|finally|raise|None|True|False|lambda|yield|assert|pass|not|and|or|is|while|break|continue',
ts:'const|let|var|function|return|import|from|export|default|async|await|if|else|for|of|in|new|type|interface|extends|class|true|false|null|undefined|throw|try|catch',
json:'true|false|null',yaml:'true|false|on',bash:'cd|export|if|then|fi|echo'
};
function hl(src,lang){
  const kw=KW[lang];
  if(!kw)return esc(src);
  const com=lang==='ts'?String.raw`\/\/[^\n]*`:lang==='json'?'(?!)':'#[^\\n]*';
  const re=new RegExp(String.raw`(${com})|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(\d+(?:\.\d+)?)\b|\b(${kw})\b|([A-Za-z_]\w*)(?=\()|(@[\w.]+)`,'g');
  let out='',last=0,m;
  while((m=re.exec(src))){
    if(m[0]===''){re.lastIndex++;continue}
    out+=esc(src.slice(last,m.index));const t=esc(m[0]);
    const cls=m[1]?'com':m[2]?'str':m[3]?'num':m[4]?'kw':m[5]?'fn':'dec';
    out+=`<span class="t-${cls}">${t}</span>`;last=re.lastIndex;
  }
  return out+esc(src.slice(last));
}
function codeBlock(c){
  const id='cb'+Math.random().toString(36).slice(2,8);
  return `<div class="code" id="${id}">
  <div class="code-h">${ic('file',13)}<span class="fname">${esc(c.file||c.lang)}</span>
   ${c.out?`<button class="btn sm ghost" data-act="run" aria-label="Show sample output">${ic('play',12)} Run</button>`:''}
   <button class="btn sm ghost" data-act="copy" aria-label="Copy code">${ic('copy',12)} Copy</button></div>
  <pre><code>${hl(c.src,c.lang)}</code></pre>
  ${c.out?`<div class="code-out" hidden><div class="lbl">Sample output</div><pre>${esc(c.out)}</pre></div>`:''}
 </div>`;
}

const STORE_KEY='neuralforge.v1';
const DEFAULT_STATE={name:'',targetRole:'aie',completed:[],sections:{},notes:{},streak:0,lastActive:null,labs:[],mastered:[],projects:[],checks:{},theme:null};
const clone=o=>JSON.parse(JSON.stringify(o));
function loadState(){try{const r=localStorage.getItem(STORE_KEY);return r?{...clone(DEFAULT_STATE),...JSON.parse(r)}:clone(DEFAULT_STATE)}catch(e){return clone(DEFAULT_STATE)}}
let S=loadState();
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function touch(){
  const t=today();if(S.lastActive===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=S.lastActive===y?S.streak+1:1;S.lastActive=t;
}
function liveStreak(){if(!S.lastActive)return 0;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);return (S.lastActive===today()||S.lastActive===y)?S.streak:0}
const LAB_SKILL={rag:'rag',agent:'agents',eval:'evals',redteam:'security',testgen:'testing'};
function statusOf(L){if(S.completed.includes(L.id))return 'completed';return L.pre.every(p=>S.completed.includes(p))?'available':'locked'}
function secDone(L){return L.secs.filter((_,i)=>S.sections[L.id+':'+i]).length}
function stats(){
  const hours=LEVELS.filter(l=>S.completed.includes(l.id)).reduce((a,l)=>a+l.hours,0)+S.labs.length;
  return {levels:S.completed.length,hours,labs:S.labs.length,projects:S.projects.length,streak:liveStreak()};
}
function skillPct(){
  const got={},tot={};
  for(const k in SKILLS){got[k]=0;tot[k]=0}
  LEVELS.forEach(l=>{for(const k in l.skills){tot[k]+=l.skills[k];if(S.completed.includes(l.id))got[k]+=l.skills[k]}});
  for(const lab in LAB_SKILL){const k=LAB_SKILL[lab];tot[k]+=2;if(S.labs.includes(lab))got[k]+=2}
  const out={};for(const k in SKILLS)out[k]=tot[k]?Math.round(got[k]/tot[k]*100):0;return out;
}
function continueLevel(){
  const partial=LEVELS.find(l=>!S.completed.includes(l.id)&&secDone(l)>0&&statusOf(l)!=='locked');
  return partial||LEVELS.find(l=>statusOf(l)==='available')||LEVELS[LEVELS.length-1];
}
function toggleSection(lid,si){
  const L=LEVELS[lid],k=lid+':'+si;
  if(S.sections[k])delete S.sections[k];else{S.sections[k]=true;touch()}
  const all=secDone(L)===L.secs.length;
  if(all&&!S.completed.includes(lid)){S.completed.push(lid);save();rerender();toast(`Level ${lid} complete: +${L.hours}h`,'trophy');return}
  if(!all&&S.completed.includes(lid))S.completed=S.completed.filter(x=>x!==lid);
  save();rerender();
}
function completeLevel(lid){
  const L=LEVELS[lid];
  if(S.completed.includes(lid)){S.completed=S.completed.filter(x=>x!==lid);L.secs.forEach((_,i)=>delete S.sections[lid+':'+i]);toast('Level marked incomplete','refresh')}
  else{S.completed.push(lid);L.secs.forEach((_,i)=>S.sections[lid+':'+i]=true);touch();toast(`Level ${lid} complete: +${L.hours}h`,'trophy')}
  save();rerender();
}
function markLab(id){if(!S.labs.includes(id)){S.labs.push(id);touch();save();updateChrome();toast('Lab session recorded: +1h','flask')}}
function loadDemo(){
  S.completed=[0,1,2,3,4,5,6,7,8];S.sections={};
  S.completed.forEach(id=>LEVELS[id].secs.forEach((_,i)=>S.sections[id+':'+i]=true));

}

function drawPalette(){
  const q=$('#pal-q').value.trim().toLowerCase();
  const terms=q.split(/\s+/).filter(Boolean);
  palFiltered=palItems.filter(it=>{const h=(it.label+' '+(it.hint||'')+' '+(it.kw||'')).toLowerCase();return terms.every(t=>h.includes(t))});
  if(!q)palFiltered=palFiltered.filter(it=>it.g!=='Resources'&&it.g!=='Skills').slice(0,24);
  else palFiltered=palFiltered.slice(0,40);
  if(palSel>=palFiltered.length)palSel=Math.max(0,palFiltered.length-1);
  let html='',g='';
  palFiltered.forEach((it,i)=>{if(it.g!==g){g=it.g;html+=`<div class="p-group">${g}</div>`}
    html+=`<div class="p-item ${i===palSel?'on':''}" data-pi="${i}">${ic(it.i||'chev',15)}<span class="grow">${esc(it.label)}</span><span class="hint">${esc(it.hint||'')}</span></div>`});
  $('#pal-list').innerHTML=html||`<div class="empty"><h3>No matches</h3><p>Try a level number like "L09", a skill like "chunking", or a lab name.</p></div>`;
  const on=$('.p-item.on');on&&on.scrollIntoView({block:'nearest'});
}
function runPalette(i){
  const it=palFiltered[i];if(!it)return;closePalette();
  if(it.href)location.hash=it.href.slice(1);
  else if(it.url)window.open(it.url,'_blank','noopener');
  else if(it.act)ACT[it.act]();
}

document.addEventListener('click',e=>{
  const pi=e.target.closest('[data-pi]');if(pi){runPalette(+pi.dataset.pi);return}
  if(e.target.id==='palette'){closePalette();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t,e)}
});
document.addEventListener('keydown',e=>{
  const pal=!$('#palette').classList.contains('hidden');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal?closePalette():openPalette();return}
  if(pal){
    if(e.key==='Escape'){closePalette()}
    else if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palFiltered.length-1);drawPalette()}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);drawPalette()}
    else if(e.key==='Enter'){e.preventDefault();runPalette(palSel)}
    return;
  }
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
  if(typing)return;
  if(e.key==='/'){e.preventDefault();openPalette()}
  const m=currentPath.match(/^\/learn\/(\d+)$/);
  if(m&&(e.key==='['||e.key===']')){const n=+m[1]+(e.key===']'?1:-1);if(n>=0&&n<LEVELS.length)location.hash='/learn/'+n}
});
$('#pal-q').addEventListener('input',()=>{palSel=0;drawPalette()});

/* ---------- roadmap ---------- */
function depthOf(){const d={};const f=id=>d[id]!==undefined?d[id]:(d[id]=LEVELS[id].pre.length?Math.max(...LEVELS[id].pre.map(f))+1:0);LEVELS.forEach(l=>f(l.id));return d}
V.roadmap=()=>{
  const d=depthOf(),cols={};LEVELS.forEach(l=>(cols[d[l.id]]=cols[d[l.id]]||[]).push(l));
  const W=170,H=58,CX=200,RY=78,maxRows=Math.max(...Object.values(cols).map(c=>c.length));
  const pos={};Object.entries(cols).forEach(([c,ls])=>{const off=(maxRows-ls.length)*RY/2;ls.forEach((l,i)=>pos[l.id]={x:24+c*CX,y:24+off+i*RY})});
  const w=24+(Object.keys(cols).length)*CX,h=24+maxRows*RY;
  const edges=LEVELS.flatMap(l=>l.pre.map(p=>{const a=pos[p],b=pos[l.id];const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,mx=(x1+x2)/2;const done=S.completed.includes(p)&&S.completed.includes(l.id);return `<path class="rm-edge ${done?'done':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`})).join('');
  const nodes=LEVELS.map(l=>{const p=pos[l.id],s=statusOf(l);const lbl=s==='completed'?'✓ Completed':s==='available'?'● Available':'Locked';
    return `<g class="rm-node ${s}" data-act="go" data-href="/learn/${l.id}" tabindex="0" role="link" aria-label="Level ${l.id} ${esc(l.title)}, ${s}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8"/><rect x="${p.x}" y="${p.y+10}" width="3" height="${H-20}" rx="1.5" style="fill:${TRACK_COLOR[l.track]};stroke:none"/><text class="n" x="${p.x+12}" y="${p.y+19}">L${pad(l.id)} ${esc(l.track)}</text><text class="tt" x="${p.x+12}" y="${p.y+36}">${esc(l.short)}</text><text class="st" x="${p.x+12}" y="${p.y+50}">${lbl}  ${l.hours}h</text></g>`}).join('');
  const listView=`<div class="card"><div class="table-wrap"><table class="t"><thead><tr><th>Level</th><th>Title</th><th>Track</th><th class="num">Hours</th><th>Prerequisites</th><th>Status</th></tr></thead><tbody>${LEVELS.map(l=>`<tr class="click" data-act="go" data-href="/learn/${l.id}"><td class="mono dim">L${pad(l.id)}</td><td style="font-weight:500">${esc(l.title)}</td><td><span class="row gap">${trackDot(l.track)}${l.track}</span></td><td class="num">${l.hours}</td><td class="mono dim">${l.pre.length?l.pre.map(p=>'L'+pad(p)).join(', '):'None'}</td><td>${statusBadge(statusOf(l))}</td></tr>`).join('')}</tbody></table></div></div>`;
  const total=LEVELS.reduce((a,l)=>a+l.hours,0);
  const html=`<div class="page" style="max-width:none">
  <div class="page-head"><div><h1 class="h1">Roadmap</h1><p class="sub">21 levels from dev foundations to a role-specific capstone, about ${total} hours. Edges show prerequisites; you can open any level, locked ones included.</p></div>
  <div class="seg" role="tablist"><button class="${roadmapMode==='graph'?'on':''}" data-act="rmmode" data-m="graph">${ic('graph',13)} Graph</button><button class="${roadmapMode==='list'?'on':''}" data-act="rmmode" data-m="list">${ic('list',13)} List</button></div></div>
  <div class="legend" style="margin-bottom:12px"><span><span class="dot ok"></span>Completed</span><span><span class="dot acc"></span>Available</span><span><span class="dot"></span>Locked</span>${TRACKS.map(t=>`<span>${trackDot(t)}${t}</span>`).join('')}</div>
  ${roadmapMode==='graph'?`<div class="rm-wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Curriculum dependency graph">${edges}${nodes}</svg></div><p class="note" style="margin-top:8px">${ic('chev',13)} Scroll sideways to follow the graph. Switch to List for a compact view.</p>`:listView}
  </div>`;
  return {title:'Roadmap',crumbs:['Learn','Roadmap'],html,mount(){$$('.rm-node').forEach(n=>n.addEventListener('keydown',e=>{if(e.key==='Enter')location.hash=n.dataset.href}))}};
};

function drawRadar(){
  const body=$('#radar-body');if(!body)return;
  if(radarTab==='repos'){
    const langs=['All',...new Set(radarCache.repos.map(r=>r.lang))];
    let rows=radarCache.repos.filter(r=>(radarLang==='All'||r.lang===radarLang)&&(!radarQ||(r.name+' '+r.desc+' '+r.topics.join(' ')).toLowerCase().includes(radarQ.toLowerCase())));
    rows.sort((a,b)=>b[radarSort]-a[radarSort]);
    body.innerHTML=`<div class="card-h wrap" style="gap:8px"><input class="input" id="rq" placeholder="Filter repositories…" value="${esc(radarQ)}" style="max-width:240px"><select class="select" id="rl" style="max-width:170px">${langs.map(l=>`<option ${l===radarLang?'selected':''}>${l}</option>`).join('')}</select><div class="seg"><button class="${radarSort==='stars'?'on':''}" data-rs="stars">${ic('star',12)} Stars</button><button class="${radarSort==='forks'?'on':''}" data-rs="forks">${ic('fork',12)} Forks</button></div><span class="dim grow" style="text-align:right;font-size:12px">${rows.length} repositories</span></div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Repository</th><th>Description</th><th>Language</th><th class="num">Stars</th><th class="num">Forks</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="white-space:nowrap"><a href="${r.url}" target="_blank" rel="noopener" style="text-decoration:none;font-weight:500">${esc(r.name)}</a></td><td class="muted" style="min-width:260px">${esc(r.desc)}<div class="row gap wrap" style="margin-top:4px">${r.topics.map(t=>`<span class="badge">${t}</span>`).join('')}</div></td><td style="white-space:nowrap">${esc(r.lang)}</td><td class="num">~${fmtK(r.stars)}</td><td class="num">~${fmtK(r.forks)}</td></tr>`).join('')||`<tr><td colspan="5">${empty('search','No repositories match','Clear the filter or pick another language.')}</td></tr>`}</tbody></table></div>`;
    $('#rq').oninput=e=>{radarQ=e.target.value;const pos=e.target.selectionStart;drawRadar();const n=$('#rq');n.focus();n.setSelectionRange(pos,pos)};
    $('#rl').onchange=e=>{radarLang=e.target.value;drawRadar()};
    $$('[data-rs]').forEach(b=>b.onclick=()=>{radarSort=b.dataset.rs;drawRadar()});
  }else{
    const tags=['All',...new Set(radarCache.papers.map(p=>p.tags[0]))];
    const ps=radarCache.papers.filter(p=>paperTag==='All'||p.tags.includes(paperTag)).sort((a,b)=>b.date.localeCompare(a.date));
    body.innerHTML=`<div class="card-h wrap" style="gap:6px">${tags.map(t=>`<button class="chip ${t===paperTag?'on':''}" data-pt="${t}">${t}</button>`).join('')}</div>
    ${ps.map(p=>`<div class="list-row" style="align-items:flex-start;flex-wrap:wrap"><div class="grow"><a href="${p.url}" target="_blank" rel="noopener" style="text-decoration:none;font-weight:500">${esc(p.title)}</a><div class="muted" style="font-size:12.5px;margin-top:2px">${esc(p.summary)}</div><div class="dim" style="font-size:12px;margin-top:4px">${esc(p.authors)}, ${p.date.slice(0,4)}</div></div><span class="badge acc">${p.tags[0]}</span><span class="badge mono">arXiv:${p.id}</span></div>`).join('')}`;
    $$('[data-pt]').forEach(b=>b.onclick=()=>{paperTag=b.dataset.pt;drawRadar()});
  }
}

const QA_USE=[
 ['Test design from requirements','An LLM drafts positive, negative, boundary and security cases from a user story or acceptance criteria.','Give it the acceptance criteria plus your test-case template; require an AC reference on every case; review for gaps.','Invented requirements. Reject any case without a traceable source.'],
 ['Automation code generation','Generate Playwright or pytest code from reviewed cases, or let an agent explore a flow through a browser MCP server and emit specs.','Constrain to your page objects, fixtures and role-based locators; run lint and a dry run before review.','Brittle CSS selectors and hard-coded waits slip in. Lint for them.'],
 ['Self-healing locators','When a selector breaks, a model proposes the most similar element using attributes, text and position.','Heal at runtime only in non-blocking suites; log every heal and open a fix PR.','Silent heals can mask real regressions, such as a button that moved to the wrong page.'],
 ['Synthetic test data','Generate schema-valid records with edge values, locales and unusual but legal inputs.','Seed from your schema and constraints; validate with the same validators production uses.','Unrealistic distributions. Never paste real customer PII into prompts.'],
 ['Failure triage and flaky detection','Cluster failures by log signature and summarize likely root cause: product bug, test bug, flaky or infra.','Feed the tail of the log and the diff; require quoted evidence lines in the summary.','Confident but wrong explanations. The evidence link is mandatory.'],
 ['Visual and accessibility review','Vision-capable models compare screenshots and flag layout or accessibility issues.','Use alongside pixel diffs and axe-core, as advisory review rather than a hard gate.','Non-deterministic judgments. Do not block releases on a single run.']
];
const QA_TEST=[
 ['Golden datasets and LLM-as-a-judge','30 or more real cases with expected behavior; a judge model grades against a rubric.','Calibrate the judge on human-labelled samples; ask for a reason before the score.','Judges favor longer answers and the first option. Check for bias.'],
 ['Non-determinism strategies','Outputs vary run to run, so assertions must target properties.','Schema validation, fact extraction, repeat-N runs, pass@k and variance tracking.','Snapshot tests on raw LLM text will flake forever.'],
 ['Metamorphic testing','When the exact answer is unknown, test relations between inputs and outputs.','Paraphrase invariance, document-order invariance, negation flips, unit conversions.','Relations must hold in the domain; confirm them with the product owner.'],
 ['RAG-specific checks','Retrieval and generation fail differently and need separate metrics.','Recall@k and precision@k for retrieval; faithfulness and citation accuracy for answers.','A great answer from the wrong source is still a failure.'],
 ['Agent trajectory testing','Assert on the path, not only the final answer.','Mock tools, check tool order and arguments, enforce step and cost budgets, verify approvals.','Agents can reach a right answer through an unsafe action.'],
 ['Red teaming in CI','A regression suite of attacks mapped to the OWASP LLM Top 10.','Direct and indirect injection, secret and PII leakage, excessive agency probes; run on every prompt or model change.','Passing today does not mean safe tomorrow. Grow the suite from incidents.']
];

/* =================== RAG LAB =================== */
const RAG_DOC=`Release Quality Handbook for the Checkout Platform.
Every pull request must pass unit, contract and end-to-end suites before merge. The end-to-end suite runs on Playwright across Chromium, Firefox and WebKit.
A test is flagged as flaky when it fails and then passes on retry within the same pipeline run. Flaky tests are quarantined within 24 hours and assigned to the owning squad. Quarantined tests must be fixed or deleted within 10 working days.
For AI features, the release gate requires an evaluation pass rate of at least 85 percent on the golden dataset and no critical safety failures. The golden dataset contains 120 cases and is reviewed every sprint by the QA lead.
LLM-as-a-judge scores use a 1 to 5 rubric. Scores of 4 or above count as a pass. Judge prompts are calibrated monthly against 50 human-labelled samples.
The latency budget for the support assistant is 2.5 seconds at p95. Cost per conversation must stay below 2 cents.
Production rollouts use a canary at 5 percent of traffic for 2 hours. We roll back automatically if the error rate rises above 1 percent or the p95 latency budget is breached for 10 minutes.
Security testing includes a prompt injection suite of 40 attacks mapped to the OWASP LLM Top 10. Retrieved documents are treated as untrusted input and are never allowed to trigger tool calls directly.
Test data is synthetic and must never contain real customer PII.`;
const RAG_PRESETS=['What pass rate does the release gate require?','How are flaky tests handled?','When do we roll back a release?','What is the capital of France?'];
const rag={cfg:{doc:RAG_DOC,strategy:'sentence',size:40,overlap:1,k:3,q:RAG_PRESETS[0]},result:null,stage:-1,tab:'retrieved'};
const STOP=new Set('a an the and or of to in on for with is are be by as at it this that from we our your if when then than into must should can will not no do does each per any all there their how what which who whom why use used are was were has have had within after before'.split(' '));
const stem=w=>w.length>4?w.replace(/(ing|ed)$/,'').replace(/([^s])s$/,'$1'):w.replace(/([^s])s$/,'$1');
const toks=t=>(t.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w)&&w.length>1).map(stem);
function ragCompute(c){
  const sents=(c.doc.replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g)||[]).map(s=>s.trim()).filter(Boolean);
  const words=c.doc.split(/\s+/).filter(Boolean);
  let chunks=[];
  if(c.strategy==='sentence'){
    let cur=[],n=0;
    sents.forEach(s=>{cur.push(s);n+=s.split(' ').length;if(n>=c.size){chunks.push(cur.join(' '));cur=c.overlap>0?cur.slice(-1):[];n=cur.join(' ').split(' ').filter(Boolean).length}});
    if(cur.length&&(!chunks.length||cur.join(' ')!==chunks[chunks.length-1].split(' ').slice(-cur.join(' ').split(' ').length).join(' ')))chunks.push(cur.join(' '));
  }else{
    const ov=Math.min(c.overlap*8,c.size-1),step=Math.max(1,c.size-ov);
    for(let i=0;i<words.length;i+=step){chunks.push(words.slice(i,i+c.size).join(' '));if(i+c.size>=words.length)break}
  }
  chunks=[...new Set(chunks)].map((text,i)=>({id:i+1,text,t:toks(text)}));
  const df={};chunks.forEach(ch=>new Set(ch.t).forEach(w=>df[w]=(df[w]||0)+1));
  const N=chunks.length,idf=w=>Math.log((N+1)/((df[w]||0)+1))+1;
  const vec=ts=>{const v={};ts.forEach(w=>v[w]=(v[w]||0)+1);let norm=0;for(const w in v){v[w]*=idf(w);norm+=v[w]*v[w]}norm=Math.sqrt(norm)||1;for(const w in v)v[w]/=norm;return v};
  chunks.forEach(ch=>ch.v=vec(ch.t));
  const qt=toks(c.q).filter(w=>df[w]);const qv=vec(qt);
  chunks.forEach(ch=>{let s=0;for(const w in qv)s+=qv[w]*(ch.v[w]||0);ch.score=s});
  const ranked=[...chunks].sort((a,b)=>b.score-a.score),top=ranked.slice(0,c.k);
  const qset=new Set(qt);
  let cand=[];top.forEach((ch,ri)=>{(ch.text.match(/[^.!?]+[.!?]*/g)||[]).forEach(s=>{const st=toks(s);const sc=st.filter(w=>qset.has(w)).reduce((a,w)=>a+idf(w),0);if(sc>0&&ch.score>0.08)cand.push({s:s.trim(),sc,rank:ri+1})})});
  cand.sort((a,b)=>b.sc-a.sc);const best=cand.length?cand[0].sc:0;const seen=new Set();const picked=cand.filter(x=>x.sc>=best*0.6&&!seen.has(x.s)&&seen.add(x.s)).slice(0,2);
  const answer=picked.length?picked:null;
  const ansToks=new Set(answer?answer.flatMap(a=>toks(a.s)):[]);
  const metrics={top1:top[0]?top[0].score:0,precision:top.filter(t=>t.score>=0.1).length/Math.max(1,top.length),relevance:qt.length?qt.filter(w=>ansToks.has(w)).length/qt.length:0,faith:answer?1:null,latency:Math.round(38+chunks.length*3+c.k*14+(answer?420:120))};
  return {sents,words:words.length,chunks,ranked,top,qt,vocab:Object.keys(df).length,answer,metrics};
}
function ragLab(lab){
  const c=rag.cfg;
  const left=`<div class="h3" style="margin-bottom:12px">Pipeline config</div>
   <label class="field"><span>Source document</span><textarea class="textarea" id="rag-doc" rows="9" style="font-size:12px">${esc(c.doc)}</textarea></label>
   <label class="field"><span>Chunking strategy</span><select class="select" id="rag-strat"><option value="sentence" ${c.strategy==='sentence'?'selected':''}>Sentence-aware</option><option value="fixed" ${c.strategy==='fixed'?'selected':''}>Fixed word window</option></select></label>
   <label class="field"><span>Chunk size (words) <b id="rag-size-v">${c.size}</b></span><input type="range" id="rag-size" min="15" max="120" value="${c.size}"></label>
   <label class="field"><span>Overlap <b id="rag-ov-v">${c.overlap}</b></span><input type="range" id="rag-ov" min="0" max="3" value="${c.overlap}"></label>
   <label class="field"><span>Top-k <b id="rag-k-v">${c.k}</b></span><input type="range" id="rag-k" min="1" max="5" value="${c.k}"></label>
   <p class="note">${ic('alert',13)} Embeddings are simulated with TF-IDF vectors so every score is inspectable. Swap in a real embedding model for semantic matching.</p>`;
  const stages=[['file','Parse'],['layers','Chunk'],['spark','Embed'],['search','Retrieve'],['bot','Generate'],['target','Evaluate']];
  const center=`<div class="row gap" style="margin-bottom:10px"><input class="input grow" id="rag-q" value="${esc(c.q)}" aria-label="Question"><button class="btn primary" id="rag-run">${ic('play',13)} Run pipeline</button></div>
   <div class="row gap wrap" style="margin-bottom:16px">${RAG_PRESETS.map(p=>`<button class="chip" data-preset="${esc(p)}">${esc(p)}</button>`).join('')}</div>
   <div class="pipe" id="rag-pipe">${stages.map(([i,n],k)=>(k?`<span class="arrow">${ic('chev',14)}</span>`:'')+`<div class="stage" data-st="${k}"><div class="sn">${ic(i,13)} ${n}</div><div class="sd" id="sd-${k}">idle</div></div>`).join('')}</div>
   <div class="h3" style="margin:20px 0 8px">Answer</div><div id="rag-answer" class="answer"><span class="dim">Run the pipeline to generate a grounded answer.</span></div>
   <div class="h3" style="margin:20px 0 8px">Evaluation</div><div class="tiles" id="rag-metrics">${['Top-1 similarity','Context precision@k','Answer relevance','Faithfulness','Latency (sim)'].map(l=>`<div class="tile"><div class="l">${l}</div><div class="v dim">–</div></div>`).join('')}</div>`;
  const right=`<div class="tabs" style="margin:-4px -4px 12px"><button data-rtab="retrieved" class="${rag.tab==='retrieved'?'on':''}">Retrieved chunks</button><button data-rtab="all" class="${rag.tab==='all'?'on':''}">All chunks</button><button data-rtab="prompt" class="${rag.tab==='prompt'?'on':''}">Prompt</button></div><div id="rag-insp"><p class="dim" style="font-size:13px">Chunks, similarity scores and the assembled prompt appear here after a run.</p></div>`;
  return {html:labShell(lab,left,center,right),mount(){
    [['rag-size','size'],['rag-ov','overlap'],['rag-k','k']].forEach(([id,key])=>{const el=$('#'+id);el.oninput=()=>{$('#'+id+'-v').textContent=el.value;rag.cfg[key]=+el.value}});
    $('#rag-strat').onchange=e=>rag.cfg.strategy=e.target.value;
    $('#rag-doc').oninput=e=>rag.cfg.doc=e.target.value;
    $('#rag-q').oninput=e=>rag.cfg.q=e.target.value;
    $('#rag-q').onkeydown=e=>{if(e.key==='Enter')runRag()};
    $('#rag-run').onclick=runRag;
    $$('[data-preset]').forEach(b=>b.onclick=()=>{$('#rag-q').value=rag.cfg.q=b.dataset.preset;runRag()});
    $$('[data-rtab]').forEach(b=>b.onclick=()=>{rag.tab=b.dataset.rtab;$$('[data-rtab]').forEach(x=>x.classList.toggle('on',x===b));drawRagInsp()});
    if(rag.result){rag.stage=6;drawRagStages();drawRagOut();drawRagInsp()}
  }};
}
let ragTimer=null;
function runRag(){
  if(!rag.cfg.doc.trim()){toast('Add a source document first','alert');return}
  if(!rag.cfg.q.trim()){toast('Type a question to retrieve against','alert');return}
  rag.result=ragCompute(rag.cfg);rag.stage=0;clearInterval(ragTimer);
  $('#rag-answer').innerHTML='<div class="skel" style="width:80%;margin:4px 0"></div><div class="skel" style="width:55%;margin:8px 0 4px"></div>';
  drawRagStages();
  ragTimer=setInterval(()=>{rag.stage++;if(!$('#rag-pipe')){clearInterval(ragTimer);return}drawRagStages();if(rag.stage>=6){clearInterval(ragTimer);drawRagOut();drawRagInsp();markLab('rag')}},260);
}
function drawRagStages(){
  const r=rag.result;if(!r)return;
  const d=[`${r.sents.length} sent, ${r.words} words`,`${r.chunks.length} chunks`,`${r.vocab} dims`,`top-${rag.cfg.k}, best ${r.metrics.top1.toFixed(2)}`,r.answer?`${r.answer.length} cited sent.`:'abstained',`faithful ${r.answer?'1.00':'n/a'}`];
  $$('.stage').forEach((el,k)=>{el.classList.toggle('done',k<rag.stage);el.classList.toggle('run',k===rag.stage);$('#sd-'+k).textContent=k<rag.stage?d[k]:k===rag.stage?'running…':'idle';const i=el.querySelector('.sn .i');if(k<rag.stage&&i&&!el.dataset.ck){el.dataset.ck=1}});
}
function hlTerms(text,qt){const q=new Set(qt);return text.split(/(\s+)/).map(w=>{const t=toks(w);return t.length&&t.some(x=>q.has(x))?`<mark>${esc(w)}</mark>`:esc(w)}).join('')}
function drawRagOut(){
  const r=rag.result,m=r.metrics;
  $('#rag-answer').innerHTML=r.answer?r.answer.map(a=>`${esc(a.s)} <span class="cite">${a.rank}</span>`).join(' ')+`<div class="note" style="margin-top:10px">${ic('check',13)} Extractive answer built only from retrieved chunks, with citations to chunk rank.</div>`:`<b>I couldn’t find this in the provided documents.</b><div class="note" style="margin-top:8px">${ic('shield',13)} Top similarity ${m.top1.toFixed(2)} is below the 0.08 grounding threshold, so the pipeline abstains instead of guessing. This is the behavior your eval set should reward.</div>`;
  const t=(l,v,cls='')=>`<div class="tile ${cls}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  $('#rag-metrics').innerHTML=t('Top-1 similarity',m.top1.toFixed(3),m.top1>=0.2?'ok':m.top1>=0.08?'warn':'err')+t('Context precision@k',m.precision.toFixed(2),m.precision>=0.6?'ok':'warn')+t('Answer relevance',m.relevance.toFixed(2),m.relevance>=0.5?'ok':'warn')+t('Faithfulness',m.faith===null?'n/a':'1.00',m.faith===null?'':'ok')+t('Latency (sim)',m.latency+'ms');
}
function drawRagInsp(){
  const r=rag.result,box=$('#rag-insp');if(!r||!box)return;
  const topIds=new Set(r.top.map(t=>t.id));const mx=Math.max(...r.ranked.map(c=>c.score),0.001);
  const card=(ch,rank)=>`<div class="chunk ${topIds.has(ch.id)?'hit':''}"><div class="chunk-h">${rank?`<span class="cite">${rank}</span>`:''}<span class="mono dim">chunk_${pad(ch.id)}</span><span class="score"><i style="width:${ch.score/mx*100}%"></i></span><span class="mono" style="font-size:11.5px">${ch.score.toFixed(3)}</span></div>${hlTerms(ch.text,r.qt)}</div>`;
  if(rag.tab==='retrieved')box.innerHTML=`<p class="dim" style="font-size:12px;margin:0 0 8px">Query terms: ${r.qt.map(t=>`<span class="badge">${esc(t)}</span>`).join(' ')||'none matched the index'}</p>`+r.top.map((c,i)=>card(c,i+1)).join('');
  else if(rag.tab==='all')box.innerHTML=`<p class="dim" style="font-size:12px;margin:0 0 8px">${r.chunks.length} chunks in document order. Retrieved ones are outlined.</p>`+r.chunks.map(c=>card(c,r.top.findIndex(t=>t.id===c.id)+1||0)).join('');
  else{const src=r.top.map((c,i)=>`[${i+1}] ${c.text}`).join('\n\n');box.innerHTML=codeBlock({lang:'text',file:'assembled_prompt.txt',src:`Answer using only the sources below. Cite like [1].\nIf the answer is not in the sources, say you don't know.\n\n<sources>\n${src}\n</sources>\n\nQuestion: ${rag.cfg.q}`})}
}

function agDraw(){

  const calls=vis.filter(s=>s.ph==='tool').length,errs=vis.filter(s=>s.err).length,ms=vis.reduce((a,s)=>a+s.ms,0),tk=vis.reduce((a,s)=>a+s.tk,0);

    ${s.ph==='approval'&&ag.pending&&i===ag.i-1?`<div class="row gap" style="margin-top:8px"><span class="btn sm primary" data-dec="1" role="button">${ic('check',12)} Approve</span><span class="btn sm" data-dec="0" role="button">${ic('x',12)} Deny</span></div>`:''}</div><span class="ms">${s.ms?s.ms+'ms':''}</span></button>`).join(''):empty('bot','Agent idle','Press Run to play the trace, or Step to advance one action at a time. Every tool call is bounded by a budget and logged.');
  $$('[data-si]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-dec]'))return;ag.sel=+b.dataset.si;agDraw()});

  const sel=$('.step.sel');sel&&sel.scrollIntoView({block:'nearest'});
}

function evCompute(ver){const vi=ver==='v1'?2:3;const rows=EVAL_ROWS.map((r,i)=>({i,input:r[0],exp:r[1],act:r[vi][0],score:r[vi][1],reason:r[vi][2],lat:r[vi][3],critical:!!r[4]}));
