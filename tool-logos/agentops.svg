  <rect x="120" y="108" width="80" height="60" rx="16" fill="url(#ao)"/>
  <circle cx="146" cy="138" r="7" fill="#1c1410"/>
  <circle cx="174" cy="138" r="7" fill="#1c1410"/>
  <rect x="72" y="208" width="176" height="12" rx="6" fill="#f4a582" opacity="0.25"/>
  <rect x="72" y="208" width="112" height="12" rx="6" fill="url(#ao)"/>
  <rect x="72" y="236" width="76" height="10" rx="5" fill="#f4a582" opacity="0.45"/>
