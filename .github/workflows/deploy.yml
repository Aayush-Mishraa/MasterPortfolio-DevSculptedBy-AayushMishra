name: Deploy Static Website to Hostinger

on:
  # Trigger deployment automatically on every push to main
  push:
    branches:
      - main
  # F07: the Projects and Open Source pages show the GitHub snapshot taken at
  # build time, so a scheduled build keeps it fresh (prebuild re-fetches it).
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP Deploy to Hostinger
    runs-on: ubuntu-latest
    env:
      # Steps that need a secret check these (the secrets context can't be used in `if`).
      HAS_API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN != '' }}

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build production app
      - name: Build React app
        run: npm run build
        env:
          CI: false
          # read-only token so the prebuild GitHub snapshot isn't rate-limited
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4a: prerender every route into real HTML (F06), then check the raw HTML
      # (unique titles, canonicals, contact text, 404 page) before anything ships.
      - name: Set up Node 20 for the prerender
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium for the prerender
        run: npx playwright install --with-deps chromium

      - name: Prerender pages, sitemap, llms.txt and share images
        run: node scripts/prerender/prerender.mjs

      - name: Check the prerendered HTML
        run: node scripts/prerender/check-html.mjs

      # Step 4b: the PHP API (F02). Production dependencies only, a syntax check,
      # then api/ is copied into build/ so the upload below carries it.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check PHP syntax
        run: find api -path api/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Stage the API into the build
        run: node scripts/deploy/stage-api.mjs

      # Written outside the web root (domains/aayushmishra.engineer/private/); missing
      # secrets leave those settings empty and /api/health.php reports them.
      - name: Write the API config from secrets
        env:
          API_APP_SECRET: ${{ secrets.API_APP_SECRET }}
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
          API_CLIENT_IP_HEADER: ${{ secrets.API_CLIENT_IP_HEADER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_WEBHOOK_SECRET: ${{ secrets.BUTTONDOWN_WEBHOOK_SECRET }}
        run: php scripts/deploy/write-api-config.php deploy-private/api-config.php

      # Step 5: Upload website files to Hostinger public_html via FTP
      # Uses incremental sync state to avoid unnecessary uploads where possible.
      - name: Resolve FTP host to IPv4
        run: |
          FTP_SERVER_RAW="${{ secrets.FTP_HOST }}"

          if [ -z "$FTP_SERVER_RAW" ]; then
            FTP_SERVER_RAW="${{ secrets.FTP_SERVER }}"
          fi

          if [ -z "$FTP_SERVER_RAW" ]; then
            echo "FTP host is missing. Set FTP_HOST (preferred) or FTP_SERVER in repository secrets."
            exit 1
          fi

          FTP_PORT_EFFECTIVE="${{ secrets.FTP_PORT }}"
          if [ -z "$FTP_PORT_EFFECTIVE" ]; then
            FTP_PORT_EFFECTIVE="21"
          fi

          if echo "$FTP_SERVER_RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            FTP_SERVER_IPV4="$FTP_SERVER_RAW"
          else
            FTP_SERVER_IPV4=$(getent ahostsv4 "$FTP_SERVER_RAW" | awk '{print $1; exit}')
          fi

          if [ -z "$FTP_SERVER_IPV4" ]; then
            echo "Unable to resolve IPv4 for FTP server: $FTP_SERVER_RAW"
            exit 1
          fi

          echo "Using FTP IPv4 endpoint: $FTP_SERVER_IPV4"
          echo "Using FTP port: $FTP_PORT_EFFECTIVE"

          # Validate TCP reachability early to fail with a clearer error.
          if ! timeout 8 bash -c "cat < /dev/null > /dev/tcp/$FTP_SERVER_IPV4/$FTP_PORT_EFFECTIVE"; then
            echo "Unable to connect to FTP endpoint $FTP_SERVER_IPV4:$FTP_PORT_EFFECTIVE from runner."
            exit 1
          fi

          echo "FTP_SERVER_IPV4=$FTP_SERVER_IPV4" >> $GITHUB_ENV
          echo "FTP_PORT_EFFECTIVE=$FTP_PORT_EFFECTIVE" >> $GITHUB_ENV

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_IPV4 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_EFFECTIVE }}
          protocol: ftps
          
          # Deploy from the build folder (production files)
          local-dir: ./build/

          # Hostinger web root for aayushmishra.engineer (the FTP login sees the whole account,
          # so /public_html/ would be the account's primary site, not this domain)
          server-dir: /domains/aayushmishra.engineer/public_html/

          # Keep remote files that are not in local repo (safer default)
          dangerous-clean-slate: false

          # Sync state file helps reduce unnecessary uploads (renamed to v2 on 2026-10-02 to force a
          # full re-upload after index.html/.htaccess/robots.txt were deleted on the server)
          state-name: .ftp-deploy-sync-state-v2.json

          # Exclude files/folders that should never be deployed
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/.idea/**
            **/.env*
            **/coverage/**
            **/*.md
            **/*.ps1
            **/*.bat
            **/hostinger-deployment*.zip

      # Step 5b: the API config goes next to public_html, never inside it.
      - name: Upload the API config (outside the web root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_IPV4 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_EFFECTIVE }}
          protocol: ftps
          local-dir: ./deploy-private/
          server-dir: /domains/aayushmishra.engineer/private/
          dangerous-clean-slate: false
          state-name: .ftp-private-sync-state.json

      # Step 5c: create or update the database tables. Safe to repeat. A failure here
      # (database not set up yet, CDN challenge) doesn't undo the deploy; see the log.
      - name: Apply database migrations
        if: ${{ env.HAS_API_ADMIN_TOKEN == 'true' }}
        continue-on-error: true
        env:
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: |
          sleep 10
          curl -sS --fail-with-body --max-time 60 -X POST             -A "aayushmishra-deploy/1.0"             -H "Authorization: Bearer $API_ADMIN_TOKEN"             https://aayushmishra.engineer/api/migrate.php

      # Step 6: Upload additional standalone apps that must also live under public_html
      - name: Deploy contentmanagementsystem folder
        if: ${{ hashFiles('contentmanagementsystem/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_IPV4 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_EFFECTIVE }}
          protocol: ftps
          local-dir: ./contentmanagementsystem/
          server-dir: /domains/aayushmishra.engineer/public_html/contentmanagementsystem/
          dangerous-clean-slate: false
          state-name: .ftp-cms-sync-state.json

      - name: Deploy prestashopecommerce folder
        if: ${{ hashFiles('prestashopecommerce/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_IPV4 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_EFFECTIVE }}
          protocol: ftps
          local-dir: ./prestashopecommerce/
          server-dir: /domains/aayushmishra.engineer/public_html/prestashopecommerce/
          dangerous-clean-slate: false
          state-name: .ftp-prestashop-sync-state.json

      - name: Deploy ecommerceautomation folder
        if: ${{ hashFiles('ecommerceautomation/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_IPV4 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_EFFECTIVE }}
          protocol: ftps
          local-dir: ./ecommerceautomation/
          server-dir: /domains/aayushmishra.engineer/public_html/ecommerceautomation/
          dangerous-clean-slate: false
          state-name: .ftp-ecommerce-sync-state.json
